server {
    listen 8443 ssl;
    server_name locus-novyj.187-124-165-215.nip.io;
    client_max_body_size 50m;
    ssl_certificate /etc/letsencrypt/live/locus-novyj.187-124-165-215.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locus-novyj.187-124-165-215.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
