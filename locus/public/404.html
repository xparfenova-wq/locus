<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Такой страницы ещё нет</title>
<link rel="icon" href="/api/favicon?v=L" type="image/svg+xml">
<link rel="stylesheet" href="/css/obschij.css">
<style>
                                                           
                                                            
                                               
.net-str{min-height:100vh;display:grid;place-items:center;padding:30px 20px}
.net-k{text-align:center;max-width:430px}
.net-karta{width:260px;height:120px;margin:0 auto 34px;display:block}
.nk-l{stroke:var(--lin);stroke-width:1.2;fill:none;
stroke-dasharray:240;stroke-dashoffset:240;
animation:nk-linija .9s .5s cubic-bezier(.3,.8,.4,1) forwards}
.nk-t{opacity:0;animation:nk-tochka .42s cubic-bezier(.2,.9,.3,1) forwards}
.nk-t:nth-of-type(1){animation-delay:.05s}
.nk-t:nth-of-type(2){animation-delay:.17s}
.nk-t:nth-of-type(3){animation-delay:.29s}
.nk-t:nth-of-type(4){animation-delay:.41s}
                                                                      
.nk-poterjalas{opacity:0;
animation:nk-tochka .42s 1.3s cubic-bezier(.2,.9,.3,1) forwards,
          nk-kachaetsja 2.6s 1.8s ease-in-out infinite}
@keyframes nk-tochka{from{opacity:0;transform:scale(.3)}
to{opacity:1;transform:scale(1)}}
@keyframes nk-linija{to{stroke-dashoffset:0}}
@keyframes nk-kachaetsja{0%,100%{transform:translateY(0)}
50%{transform:translateY(-5px)}}
.net-z{font-size:25px;font-weight:500;letter-spacing:-.03em;margin-bottom:11px}
.net-p{font-size:13.5px;color:var(--t2);line-height:1.55;margin-bottom:26px}
.net-adres{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;
color:var(--t3);background:var(--pole);padding:5px 11px;border-radius:8px;
display:inline-block;margin-bottom:26px;max-width:100%;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.net-knopki{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){
  .nk-l,.nk-t,.nk-poterjalas{animation:none;opacity:1;stroke-dashoffset:0}
}
@media (max-width:760px){
  .net-karta{width:210px;height:100px}
  .net-z{font-size:21px}
}
</style></head><body>
<div id="menju"></div>
<div class="net-str"><div class="net-k">
  <svg class="net-karta" viewBox="0 0 260 120" fill="none"
       xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path class="nk-l" d="M30 78 L88 46 L146 62 L204 34"/>
    <circle class="nk-t" cx="30" cy="78" r="6" fill="#7182CB"/>
    <circle class="nk-t" cx="88" cy="46" r="6" fill="var(--pal-3)"/>
    <circle class="nk-t" cx="146" cy="62" r="6" fill="#D8D8D8"/>
    <circle class="nk-t" cx="204" cy="34" r="6" fill="#7182CB"/>
    <circle class="nk-poterjalas" cx="232" cy="96" r="5.5" fill="#FF6716"/>
  </svg>
  <div class="net-z">Упс, кажется, такой страницы ещё нет</div>
  <div class="net-p">Эта точка не связана ни с одной другой.
    Может, адрес набран с ошибкой, а может, мы до неё ещё не дошли</div>
  <div class="net-adres" id="adres"></div>
  <div class="net-knopki">
    <a class="kn tmn" href="/prostranstvo.html">Вернуться на главную</a>
    <a class="kn" href="#" id="nazad">Назад</a>
  </div>
</div></div>
<script src="/js/dannye.js"></script>
<script src="/js/nedeli.js"></script>
<script src="/js/api.js"></script>
<script src="/js/karta.js"></script>
<script src="/js/obschij.js"></script>
<script src="/js/kalendar.js"></script>
<script>
(function () {
  document.getElementById('adres').textContent = location.pathname;
  document.getElementById('nazad')?.addEventListener('click', (e) => {
    e.preventDefault();
    if (history.length > 1) history.back();
    else location.href = '/prostranstvo.html';
  });
                                                              
                                        
  SPR.zagruzit().then(() => {
    document.getElementById('menju').innerHTML = O.menju('', {});
  }).catch(() => {});
  document.body.dataset.gotovo = '1';
})();
</script>
</body></html>
