<script>
(function () {
let SPRAV = null, JA = API.ja;
let JA_CHELOVEK = null, N = null, VID = null, BOT = null,
    SESSII = [], ONB = null, FOKUS = null, MOE = null,
    ANKETA = null, MOJO = null, MOI_PROEKTY = [];

                                                             
                                                              
  
                                                             
                                                          
                                                               
                                                              
                                                
const GRUPPY_ANKETY = LocusAnketa.gruppy;

const POLJA_ANKETY = GRUPPY_ANKETY.flatMap(([, polja]) => polja);

const DOSTUP = { polnyj: 'полный доступ', bez_deneg: 'без сумм',
                 tolko_svoe: 'только своё', gost: 'гость' };
const BOT_CHTO = { vse: 'всё', tolko_moi: 'только задачи на меня',
                   tolko_prosrochki: 'только просрочки' };
const VID_ZADACH = { spisok: 'списком', doska: 'доской' };
                                                                
                                                
const CHI_ZADACHI = { moi: 'мои', vse: 'все' };

function sklUstr(n) {
  const o = n % 10, s = n % 100;
  if (o === 1 && s !== 11) return 'устройство';
  if (o >= 2 && o <= 4 && (s < 12 || s > 14)) return 'устройства';
  return 'устройств';
}

async function zagruzit() {
  const [chel, nastr, vid, bot, ses, onb, fok, ank, mojo] = await Promise.all([
    API.odna('ljudi', JA + '/celikom'),
    API.ekran('nastrojki', {}),
    API.ekran('nastrojki/vid', {}),
    API.ekran('nastrojki/bot', {}),
    API.ekran('sessii', {}),
    API.ekran('onbording', {}),
    API.ekran('fokus', {}),
    API.odna('anketa', JA).catch(() => null),
    API.ekran('sostojanija/moe', {}).catch(() => null),
  ]);
  JA_CHELOVEK = chel; N = nastr; VID = vid; BOT = bot;
  try {
    const pr = await API.spisok('proekty', { na_stranice: 200 });
    MOI_PROEKTY = (pr.spisok || []).filter((x) =>
      !x.arhiv && x.kto_vedet === Number(JA));
  } catch { MOI_PROEKTY = []; }
  SESSII = ses.spisok || []; ONB = onb; FOKUS = fok;
  ANKETA = ank; MOJO = mojo;
}

                            
                                                                  
                                                                  
                                                                      
                                                                    
                               
const IZM = {};
let IZM_PILJULJA = null, PREFS = null, PILL_BASE = null;
const est_izmenenija = () => Object.keys(IZM).length > 0 || IZM_PILJULJA !== null;

                                                 
function primenit_kursor(v) {
  if (v) document.documentElement.dataset.kursor = 'sistemnyj';
  else delete document.documentElement.dataset.kursor;
}

function otmetitSohranenie() {
  const k = document.getElementById('kab-sohr');
  if (!k) return;
  const est = est_izmenenija() && (!PREFS || PREFS.canSave());
  k.classList.toggle('akt', est);
  k.setAttribute('aria-disabled', String(!est));
  k.disabled = !est;
}

function pomenjat(pole, znachenie) {
  if (!PREFS) return;
  if (pole === 'razdely_menju') {
    const initial = PREFS.confirmed().razdely_menju;
    const effective = Array.isArray(initial) && initial.length ? initial : VSE_RAZDELY_PERVOGO;
    if (effective.length === znachenie.length && effective.every(x=>znachenie.includes(x))) znachenie = initial;
  }
  PREFS.edit(pole, znachenie);
}
function validPreferencesExtra(extra) {
  if (!extra || typeof extra !== 'object' || Array.isArray(extra)) return false;
  if (extra.pill != null && (!Array.isArray(extra.pill) || !extra.pill.length ||
      extra.pill.length > 4 || new Set(extra.pill).size !== extra.pill.length ||
      extra.pill.some(v=>!VSE_RAZDELY_MENJU.includes(v)))) return false;
  const p=extra.palette;
  return p === undefined || p && typeof p === 'object' && validPalette(p.svoja) &&
    ['custom','preset'].includes(p.origin) && (p.vybor === 'svoja' || Boolean(palitraPoKodu(p.vybor))) &&
    typeof p.pravka === 'boolean' && Number.isInteger(p.sv_aktiv) && p.sv_aktiv >= -1 && p.sv_aktiv < 5 &&
    Number.isFinite(p.jar) && p.jar >= 15 && p.jar <= 100 && Array.isArray(p.tochki) && p.tochki.length <= 5 &&
    p.tochki.every(t=>t == null || ['x','y','ugol','t'].every(k=>Number.isFinite(t[k])) &&
      t.x >= 0 && t.x <= 100 && t.y >= 0 && t.y <= 100 && t.t >= 0 && t.t <= 1);
}
function preferencesStart() {
  PILL_BASE=razdely_piljuli_k().slice();
  PREFS=LocusPreferencesState.create(N,{
    extraDirty:e=>Boolean(e.palette?.pravka) || e.pill != null,
    validateExtra:validPreferencesExtra,
    fieldLabels:{...SWITCH_LABELS,bot_sobytija:'События бота',bot_chto:'Что присылать',startovyj_ekran:'Стартовый экран',
      chi_zadachi:'Чьи задачи',vid_zadach:'Вид задач',razdely_menju:'Разделы меню',prioritetnoe_napravlenie:'Моё направление',
      prioritetnye_napravlenija:'Приоритетные направления',svoi_cveta:'Цвета'},
    formatValue:(field,value)=>{
      if(field in SWITCH_LABELS)return value?'включено':'выключено';
      if(field==='svoi_cveta')return JSON.stringify(value||{});
      const names={...BOT_CHTO,...VID_ZADACH,...CHI_ZADACHI,net:'нет',
        ...Object.fromEntries((VID.startovye_ekrany||[]).map(v=>[v.kod,v.imja])),
        ...Object.fromEntries((SPRAV.napravlenija||[]).map(v=>[v.kod,v.imja]))};
      if(Array.isArray(value))return value.map(v=>names[v]||v).join(', ')||'по умолчанию';
      if(field==='bot_sobytija')return (BOT.sobytija||[]).map(v=>v.imja+': '+((Object.hasOwn(value||{},v.kod)?value[v.kod]:v.vkljucheno)?'включено':'выключено')).join(', ');
      return names[value]||String(value??'по умолчанию');
    },
    onChange:({value,extra,dirty,reason})=>{
      N=value;Object.keys(IZM).forEach(k=>delete IZM[k]);Object.assign(IZM,dirty);
      IZM_PILJULJA=extra.pill ?? null;
      if (extra.palette) Object.assign(PAL,extra.palette);
      else if (reason === 'discard') palInit();
      primenit_kursor(N.svoj_kursor);palPokaz();pererisovatNastrojki();otmetitSohranenie();
    },
    onActorChange:()=>{
      for(const id of ['profil','nastrojki','prochee','kab-refl','kab-grafik'])document.getElementById(id)?.replaceChildren();
      document.getElementById('kab-sohr')?.remove();
      const place=document.getElementById('nastrojki');if(place)place.textContent='Аккаунт сменился. Открой страницу заново';
    }
  });
}
async function sohranitVse() {
  if (!PREFS || !est_izmenenija() || !PREFS.canSave()) return;
  const pill=IZM_PILJULJA?.slice(),telo=PREFS.dirty();
  try {
    await PREFS.save('pravka');
    if (pill) {
      const text=JSON.stringify(pill);
      localStorage.setItem(KLJUCH_PILJULI_K,text);
      if(localStorage.getItem(KLJUCH_PILJULI_K)!==text)throw new Error('Браузер не сохранил состав меню');
      PILL_BASE=pill;
      if(LocusPreferencesModel.same(PREFS.extra().pill,pill))PREFS.setExtra('pill',null);
    }
    if ('prioritetnoe_napravlenie' in telo) {
      try {
        const kod=PREFS.confirmed().prioritetnoe_napravlenie;
        if(kod && kod!=='net')localStorage.setItem(KLJUCH_SVOJO_NAPR_K,kod);
        else localStorage.removeItem(KLJUCH_SVOJO_NAPR_K);
      } catch {}
    }
    if(pill)O.tost('Состав меню сохранён на этом устройстве');
  } catch(e) { O.tost(e.serverConfirmed ? e.message : 'Сохранение не завершено: '+e.message); }
}

function profil() {
  const c = JA_CHELOVEK.chelovek;
  const pochta = (JA_CHELOVEK.kontakty || []).find((k) => k.tip === 'pochta' && k.osnovnoj)
    || (JA_CHELOVEK.kontakty || []).find((k) => k.tip === 'pochta');
  const tg = (JA_CHELOVEK.kontakty || []).find((k) => k.tip === 'telegram');
                                                                  
  document.getElementById('profil').innerHTML =
    (c.foto ? `<div class="kab-foto"><img src="${O.ekranirovat(c.foto)}" alt=""></div>`
            : '<div class="kab-foto"></div>') +
    `<div class="kab-im">${O.ekranirovat(c.imja)}</div>
     <div class="kab-rol">${DOSTUP[c.dostup] || 'доступ не задан'}</div>
     <!-- Открытые задачи, сессии фокуса и устройства убраны:
          её слова 27 октября — «зачем мне информация про мои
          открытые задачи, сессии фокуса и 9 устройств, а ещё
          моя почта. Почему я её не могу редактировать»
          Задачи живут в Задачах, фокус в Полезном -->
     <div class="kab-ci">
       <!-- Почта и телеграм редактируются прямо здесь -->
       <label class="kab-pole"><span class="kab-pp">почта</span>
         <input class="kab-pz" id="kab-pochta" type="email"
           value="${O.ekranirovat(pochta ? pochta.znachenie : '')}"
           placeholder="почта не указана"><span id="kab-pochta-osh" class="kab-contact-warning" role="status" aria-live="polite"></span></label>
       <label class="kab-pole"><span class="kab-pp">телеграм</span>
         <input class="kab-pz" id="kab-tg" type="text"
           value="${O.ekranirovat(tg ? tg.znachenie : '')}"
           placeholder="@имя"><span id="kab-tg-osh" class="kab-contact-warning" role="status" aria-live="polite"></span></label>
     </div>`;

                                                            
                                                  
  for (const [id, vid] of [['kab-pochta', 'pochta'], ['kab-tg', 'telegram']]) {
    const pole = document.getElementById(id);
    if (!pole) continue;
    const warning=document.getElementById(id+'-osh');
    let saved=vid==='pochta'?pochta:tg,pending=false,confirmedInput=pole.value.trim(),unknownDelete=null;
    let contactId=saved?.id;
    const remember=()=>{
      JA_CHELOVEK.kontakty=(JA_CHELOVEK.kontakty||[]).filter(x=>x.id!==contactId&&x.id!==saved?.id);
      if(saved)JA_CHELOVEK.kontakty.push(saved);
      contactId=saved?.id;
    };
    const showDeleteCheck=()=>{
      if(!warning||!unknownDelete)return;
      const text=document.createElement('span');text.textContent='Удаление не подтверждено. Проверь результат перед следующим сохранением.';
      const button=document.createElement('button');button.type='button';button.className='kn';button.textContent='проверить удаление';
      button.addEventListener('click',()=>{if(unknownDelete)save();});warning.replaceChildren(text,button);
    };
    pole.addEventListener('input',()=>{warning?.replaceChildren();if(unknownDelete)showDeleteCheck();});
    const save=async () => {
      const znach = pole.value.trim();
      if(pending||(!unknownDelete&&znach===confirmedInput))return;
      pending=true;pole.disabled=true;
      try {
        if(unknownDelete){
          const result=await API.udalitKontakt(unknownDelete.record,{zapros_kljuch:unknownDelete.key,proverit:true});
          unknownDelete=null;warning?.replaceChildren();
          if(result.scope_changed)throw API.oshibkaKontekstaKontakta();
          if(result.deleted){
            saved=null;confirmedInput='';remember();
            O.tost(pole.value.trim()?'Удаление подтверждено. Новый текст остался в поле и ещё не сохранён.':'Контакт удалён');
          }else O.tost('Контакт остался в базе. Чтобы удалить его, ещё раз очисти поле и выйди из него.');
          return;
        }
        for(;;){
          try{
            if(saved){
              if(znach)saved=await API.pravitZnachenieKontakta(saved,znach);
              else{
                const attempt={record:{...saved},key:API.kljuchZaprosa()};
                try{await API.udalitKontakt(attempt.record,{zapros_kljuch:attempt.key});}
                catch(error){if(error.kod===undefined||error.kod>=500)unknownDelete=attempt;throw error;}
                saved=null;
              }
            }else if(znach)saved=(await API.sozdatKontakt({chelovek_id:c.id,tip:vid,znachenie:znach})).kontakt;
            break;
          }catch(error){
            if(error.kod!==409||!error.telo?.tekuschee)throw error;
            const current=error.telo.tekuschee;
            if(current.chelovek_id!==c.id||current.tip!==vid)throw API.oshibkaKontekstaKontakta();
            const choice=await O.razreshitKonflikt(error,{label:vid==='pochta'?'почта':'телеграм',local:znach||'Удалить контакт',current:current.znachenie});
            if(choice==='load'){saved=current;pole.value=current.znachenie;confirmedInput=pole.value.trim();remember();return;}
            if(choice!=='own')return;saved=current;
          }
        }
        confirmedInput=znach;
        remember();warning?.replaceChildren();
        O.tost('Контакт сохранён');
      } catch (e) {
        if(unknownDelete)showDeleteCheck();
        if(e.telo?.sessija_izmenilas)return;
        if(O.preduprezhdenieKontakta(warning,e.telo,vid))return;
        O.tost(unknownDelete?'Удаление не подтверждено. Проверь результат кнопкой под полем.'
          :e.kod===undefined||e.kod>=500?'Сохранение контакта не подтверждено. Текст остался в поле; обнови данные перед повторной отправкой.':'Не получилось: '+e.message);
      }finally{pending=false;if(pole.isConnected)pole.disabled=false;}
    };
    pole.addEventListener('blur',save);
  }
}

function cvetKruga(ugol, t, v) {
  const h = ((ugol % 360) + 360) % 360 / 60;
  const x = 1 - Math.abs((h % 2) - 1);
  const [r, g, b] = h < 1 ? [1, x, 0] : h < 2 ? [x, 1, 0] : h < 3 ? [0, 1, x]
    : h < 4 ? [0, x, 1] : h < 5 ? [x, 0, 1] : [1, 0, x];
  const k = (c) => Math.round((c * t + (1 - t)) * 255 * v);
  return '#' + [k(r), k(g), k(b)].map((c) =>
    Math.max(0, Math.min(255, c)).toString(16).padStart(2, '0')).join('').toUpperCase();
}

function palIzTochki(ev, krug) {
  const r = krug.getBoundingClientRect();
  const dx = ev.clientX - (r.left + r.width / 2);
  const dy = ev.clientY - (r.top + r.height / 2);
  const rad = r.width / 2;
  const d = Math.hypot(dx, dy) || 1;
  const t = Math.min(1, d / rad);
  const ugol = Math.atan2(dx, -dy) * 180 / Math.PI;
  const k = t >= 1 ? rad / d : 1;
  return { ugol, t, x: 50 + (dx * k / r.width) * 100, y: 50 + (dy * k / r.height) * 100 };
}

function palPostavit(p) {
  const i = PAL.sv_aktiv;
  if (i < 0) return;
  PAL.tochki[i] = p;
  PAL.svoja[i] = cvetKruga(p.ugol, p.t, PAL.jar / 100);
  PAL.pravka = true;PAL.origin='custom';
  rememberPalette();
  const sv = document.querySelector(`[data-pal-sv="${i}"] .pal-sv`);
  if (sv) sv.style.background = PAL.svoja[i];
  const tochka = document.getElementById('pal-tochka');
  if (tochka) { tochka.hidden = false; tochka.style.left = p.x + '%'; tochka.style.top = p.y + '%'; }
  O.primenitPalitru(PAL.svoja);
}

function cvet_po_umolchaniju(vid, kod) {
  const pere = vid === 'status' ? `--st-${kod}` : `--npr-${kod}`;

    .getPropertyValue(pere).trim();
  if (/^#[0-9a-f]{6}$/i.test(z)) return z;
  return vid === 'status' ? '#9a9aa3' : '#7182CB';
}

function vkljuchitNastrojki() {
  const blok = document.getElementById('nastrojki');
  if (!blok || blok.dataset.privjazan) return;
  blok.dataset.privjazan = '1';

  blok.addEventListener('click', (e) => {
    const pere = e.target.closest('[data-pere]');
    if (pere) { pomenjat(pere.dataset.pere, !N[pere.dataset.pere]); return; }

    const bs = e.target.closest('[data-bot-sob]');
    if (bs) {
      const s = (BOT.sobytija || []).find((x) => x.kod === bs.dataset.botSob);
      if (!s) return;
const nabor=structuredClone(N.bot_sobytija||{}),initial=PREFS.confirmed().bot_sobytija||{};
      const next=!botEventValue(s);nabor[s.kod]=next;
      if(!Object.hasOwn(initial,s.kod)&&next===Boolean(s.vkljucheno))delete nabor[s.kod];
      pomenjat('bot_sobytija',Object.keys(nabor).length?nabor:(PREFS.confirmed().bot_sobytija??{}));

      return;
    }

    const mn = e.target.closest('[data-menju]');
    if (mn) {
      const r = mn.dataset.menju;
      let vybrany = razdely_piljuli_k().slice();
      if (vybrany.includes(r)) {
                                                                     
        if (vybrany.length <= 1) { O.tost('Хотя бы один раздел нужен'); return; }
        vybrany = vybrany.filter((x) => x !== r);
      } else {
        if (vybrany.length >= 4) {
          O.tost('В пилюле четыре места: сними лишний раздел'); return;
        }
                                                        
        vybrany = VSE_RAZDELY_MENJU.filter((x) => vybrany.includes(x) || x === r);
      }
      PREFS.setExtra('pill',LocusPreferencesModel.same(vybrany,PILL_BASE)?null:vybrany);
      return;
    }

    const ns = e.target.closest('[data-napr-svoe]');
    if (ns) { pomenjat('prioritetnoe_napravlenie', ns.dataset.naprSvoe || 'net'); return; }

    const rz = e.target.closest('[data-razdel]');
    if (rz) {
      const r = rz.dataset.razdel;
      const bylo = Array.isArray(N.razdely_menju) && N.razdely_menju.length
        ? N.razdely_menju : VSE_RAZDELY_PERVOGO;
      let stalo;
      if (bylo.includes(r)) {
        if (bylo.length <= 2) { O.tost('Меньше двух разделов меню не бывает'); return; }
        stalo = bylo.filter((x) => x !== r);
      } else stalo = [...bylo, r];
      pomenjat('razdely_menju', stalo);
      return;
    }

    const pr = e.target.closest('[data-prior]');
    if (pr) {
      const kod = pr.dataset.prior;
      const bylo = Array.isArray(N.prioritetnye_napravlenija)
        ? N.prioritetnye_napravlenija : [];
      pomenjat('prioritetnye_napravlenija',
        bylo.includes(kod) ? bylo.filter((x) => x !== kod) : [...bylo, kod]);
      return;
    }

                                                                       
    const pl = e.target.closest('[data-palitra]');
    if (pl) {
      const kod = pl.dataset.palitra;
      const svoi = JSON.parse(JSON.stringify(N.svoi_cveta || {}));
const confirmed=PREFS.confirmed().svoi_cveta||{};
      const initialCode=palitraPoKodu(confirmed.palitra)?.kod || (validPalette(confirmed.svoja_palitra)?'svoja':'firmennaja');
      if(kod===initialCode){
        for(const field of ['palitra','primenennaja_palitra','status']){
          if(Object.hasOwn(confirmed,field))svoi[field]=structuredClone(confirmed[field]);else delete svoi[field];
        }
      }else{
        if(kod==='svoja'){delete svoi.palitra;svoi.primenennaja_palitra=svoi.svoja_palitra.slice();}
        else svoi.palitra=kod;
        delete svoi.status;
      }
      PAL.vybor=kod;PAL.origin=kod==='svoja'?'custom':'preset';
      PAL.pravka=false;PAL.sv_aktiv=-1;PAL.tochki=[];
      PAL.svoja=(kod==='svoja'?svoi.svoja_palitra:palitraPoKodu(kod).cveta).slice();
      rememberPalette();pomenjat('svoi_cveta',svoi);palPokaz();return;
    }

    const sv = e.target.closest('[data-pal-sv]');
    if (sv) {
      const i = Number(sv.dataset.palSv);
      PAL.sv_aktiv = PAL.sv_aktiv === i ? -1 : i;
      rememberPalette();narisovatCveta();
      return;
    }
    if (e.target.closest('#pal-sohr')) { palSohranitNabor(false); return; }
    if (e.target.closest('#pal-primenit')) { palSohranitNabor(true); return; }
    if (e.target.closest('#pal-sbros')) {
      palInit();
rememberPalette();palPokaz();narisovatCveta();
    }

  });

  let tjanu = false;
  blok.addEventListener('pointerdown', (ev) => {
    const krug = ev.target.closest('#pal-krug');
    if (!krug) return;
    ev.preventDefault();
    tjanu = true;
    try { krug.setPointerCapture(ev.pointerId); } catch {                   }
    palPostavit(palIzTochki(ev, krug));
  });
  blok.addEventListener('pointermove', (ev) => {
    if (!tjanu) return;
    const krug = document.getElementById('pal-krug');
    if (krug) palPostavit(palIzTochki(ev, krug));
  });
  const otpustil = () => {
    if (!tjanu) return;
    tjanu = false;
                                                       
    if (PAL.sv_aktiv < SLOTY_PALITRY.length - 1) PAL.sv_aktiv += 1;
    rememberPalette();narisovatCveta();
  };
  blok.addEventListener('pointerup', otpustil);
  blok.addEventListener('pointercancel', otpustil);
  blok.addEventListener('input', (ev) => {
    if (ev.target.id !== 'pal-jar') return;
    PAL.jar = Number(ev.target.value) || 100;
    document.getElementById('pal-krug')?.style.setProperty('--tma',
      (1 - PAL.jar / 100).toFixed(2));
    const t = PAL.tochki[PAL.sv_aktiv];
    if (t) palPostavit(t); else rememberPalette();
  });
}

        }catch(error){
          if(error.kod!==409||!error.telo?.tekuschee)throw error;
          const live=error.telo.tekuschee;
          const describe=row=>Object.keys(telo).map(key=>LocusAnketa.podpis(key,JA_CHELOVEK?.chelovek?.pol)+': '+String(row[key]??'')).join('\n\n');
          const choice=await O.razreshitKonflikt(error,{label:'анкета',local:describe(telo),current:describe(live)});
          if(choice==='load'){ANKETA=live;prochee();privjazat();primenitKabVkladku();return;}
          if(choice!=='own')return;
          expected=live.versija;
        }
      }
      prochee(); privjazat(); primenitKabVkladku();
      O.tost('Сохранено');
    } catch (e) { O.tost('Не получилось: ' + e.message); }
    finally{anketa_sohranjaetsja=false;}
  });

  document.getElementById('ses-vyjti')?.addEventListener('click', async () => {
    try {
      await API.udalit('sessii', 'vse');
      const ses = await API.ekran('sessii', {});
      SESSII = ses.spisok || [];
      narisovat();
      O.tost('Вышли со всех устройств');
    } catch (e) { O.tost('Не получилось: ' + e.message); }
  });
}

(async function start() {
  try {
    SPRAV = await SPR.zagruzit();
    window.DANNYE = { napravlenija: SPRAV.napravlenija, ljudi: SPRAV.ljudi,
                      statusy: SPRAV.statusy, tipy: SPRAV.tipy, zadachi: [] };
    JA = API.ja;
    await zagruzit();
                                                        
                                                               
                                                                  
                                                                
                                   
    document.getElementById('menju').innerHTML = O.menju('Пространство', {
      podrazdely: O.PODRAZDELY_PROSTRANSTVA,
      podrazdel: 'про меня',
    });
                                                                   
                                                               
    {
      const men = document.querySelector('#menju .men');
      if (men && !document.getElementById('kab-r3')) {
        const r3 = document.createElement('div');
        r3.className = 'men-r3 men-r3-fil';
        r3.id = 'kab-r3';
        men.appendChild(r3);
      }
                                                                
      if (men && !document.getElementById('kab-r4')) {
        const r4 = document.createElement('div');
        r4.className = 'men-r3 men-r3-fil kab-r4';
        r4.id = 'kab-r4';
        r4.hidden = true;
        men.appendChild(r4);
      }
      narisovatKabVkladki();
    }
    preferencesStart();palInit();
    vkljuchitNastrojki();
    narisovat();
    O.vkljuchitSkvoznoe();
    document.body.dataset.gotovo = String((ONB.shagi || []).length);
  } catch (e) {
    document.getElementById('prochee').innerHTML =
      `<div class="pusto"><div class="pusto-z">Не получилось загрузить</div>
       <div class="pusto-p">${e.message}</div></div>`;
    document.body.dataset.oshibka = e.message;
  }
})();
})();
