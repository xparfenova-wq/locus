<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Окна Locus</title>
<link rel="icon" href="/api/favicon?v=L" type="image/svg+xml">
<link rel="stylesheet" href="/css/obschij.css">
<style>
                                                                 
                                                                
                                                                  
                                                                      
.vt{max-width:760px;margin:0 auto;padding-top:10px}
.vt-z{font-size:21px;font-weight:500;letter-spacing:-.015em;padding:6px 0 2px}
.vt-p{font-size:13px;color:var(--t3);padding-bottom:10px;max-width:56ch}
.vt-g{font-size:10px;letter-spacing:.11em;text-transform:uppercase;
color:var(--t3);padding:22px 0 4px}
.vt-s{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;
align-items:center;padding:11px 0;border-bottom:1px solid var(--lin)}
.vt-n{font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;color:var(--t3)}
.vt-im{font-size:13px}
.vt-im .p{font-size:11.5px;color:var(--t3);margin-top:2px}
.vt-kn{font-size:12px;color:var(--t2);border:1px solid var(--lin);
border-radius:999px;padding:6px 13px;white-space:nowrap;cursor:pointer}
.vt-kn:hover{background:var(--tmn);color:#fff;border-color:var(--tmn)}
.vt-ssyl{font-size:11px;color:var(--t3);margin-left:8px}
#vt-sozd-mesto{max-width:760px;margin:18px auto 0}
#vt-sozd-mesto:empty{display:none}
                                                         
                                                        
.vyb-z-pole{width:100%;border:0;border-bottom:1px solid var(--lin);
background:transparent;font-family:inherit;font-size:13px;padding:7px 0;
color:var(--t1);margin-bottom:6px}
.vyb-z-pole:focus{outline:none;border-bottom-color:var(--t1)}
.vyb-z-sp{max-height:320px;overflow-y:auto}
.vyb-z-s{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;
align-items:center;padding:9px 2px;font-size:12px;
border-top:1px solid var(--lin);transition:background .12s}
.vyb-z-s:hover{background:var(--pole)}
.vyb-z-s .im{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vyb-z-s .np{font-size:10.5px;color:var(--t3);white-space:nowrap}
.pl-sr-s{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;
padding:5px 0;font-size:13px;border-top:1px solid var(--lin)}
.pl-sr-s b{font-weight:500;font-variant-numeric:tabular-nums}
.pl-sr-sh{border-top:0;color:var(--t3);font-size:11.5px}
                                                                  
                                                                  
                                                             
                                                                
                                                              
                                                             
                                    
body .vyb .sozd-vvod{display:block;width:100%;box-sizing:border-box;
font-family:inherit;font-size:21px !important;font-weight:500;color:var(--t1);
border:0 !important;border-bottom:1px solid var(--t1) !important;
border-radius:0 !important;background:transparent !important;
padding:8px 2px 10px !important;margin:0 0 2px !important;outline:none}
body .vyb .sozd-vvod::placeholder{color:var(--t3);font-weight:400}
body .vyb .sozd-lbl{display:block;font-size:11.5px;color:var(--t3);
padding:10px 2px 4px;margin:0 0 3px;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis}
body .vyb .sozd-p{display:block;min-width:0}
body .vyb .sozd-pole{display:flex;align-items:center;box-sizing:border-box;
width:100%;min-height:32px;font-size:13px;color:var(--t1);
border:0 !important;border-bottom:1px solid var(--lin) !important;
border-radius:0 !important;background:transparent !important;
padding:7px 24px 7px 2px !important;position:relative;cursor:var(--kursor), pointer}
body .vyb label.sozd-pole{padding-right:2px !important;cursor:text}
body .vyb .sozd-pole input{border:0;background:transparent;font:inherit;
color:var(--t1);width:100%;min-width:0;padding:0;outline:none}
body .vyb .sozd-pole .sozd-t{min-width:0;overflow:hidden;text-overflow:ellipsis;
white-space:nowrap}
body .vyb .sozd-pole .str{position:absolute;right:4px;top:50%;
transform:translateY(-50%)}
body .vyb .vyp.otkryt .sozd-pole,body .vyb .sozd-pole:focus-within{
border-bottom-color:var(--t1) !important}
body .vyb .sozd-opis{display:block;width:100%;box-sizing:border-box;
font-family:inherit;font-size:13px;color:var(--t1);resize:none;min-height:32px;
border:0 !important;border-bottom:1px solid var(--lin) !important;
border-radius:0 !important;background:transparent !important;
padding:6px 2px !important;outline:none}
body .vyb .sozd-opis:focus{border-bottom-color:var(--t1) !important}
body .vyb .sozd-polja{display:grid !important;
grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:4px 18px !important;
margin:0 !important}
body .vyb .sozd-polja.dve{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
body .vyb .sozd-polja.odna{grid-template-columns:minmax(0,1fr) !important}
body .vyb .k-poyasn{font-size:11.5px;color:var(--t3);line-height:1.5;
padding:8px 2px 0}
                                                                  
body .vyb .k-varianty{display:flex;flex-direction:column;gap:2px;padding-top:2px}
body .vyb .k-var{display:flex;align-items:center;gap:10px;padding:9px 2px;
font-size:13px;color:var(--t1);border-bottom:1px solid var(--lin);cursor:var(--kursor), pointer}
body .vyb .k-var i{width:15px;height:15px;border-radius:50%;flex:none;
border:1.5px solid #c9c9cf;box-sizing:border-box;transition:border-color .14s}
body .vyb .k-var.on i{border:4.5px solid var(--tmn)}
body .vyb .k-pz{counter-reset:pz}
body .vyb .k-pz-s{display:grid;grid-template-columns:20px minmax(0,1fr);
gap:8px;align-items:center;padding:7px 2px;font-size:13px;
border-bottom:1px solid var(--lin)}
body .vyb .k-pz-s::before{counter-increment:pz;content:counter(pz);
font-family:'Geist Mono',ui-monospace,monospace;font-size:11.5px;color:var(--t3)}
body .vyb .k-dob{display:inline-block;font-size:12px;color:var(--t2);
padding:9px 2px 2px;cursor:var(--kursor), pointer}
body .vyb .k-dob:hover{color:var(--t1)}
body .vyb .k-skryt{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
body .vyb .k-poisk{margin-bottom:6px}
                                                             
.vyb .pr-k{display:grid;grid-template-columns:minmax(0,1fr) 96px 80px;gap:12px;
align-items:center;padding:11px 0;border-bottom:1px solid var(--lin);font-size:13px}
.vyb .pr-k .st,.vyb .pr-k .dt{font-size:11.5px;color:var(--t3);white-space:nowrap;
overflow:hidden;text-overflow:ellipsis}
.vyb .pr-rjad{flex-wrap:wrap !important;gap:10px !important}
.vyb .pr-psk-o{flex:1 1 160px;min-width:0}
@media (max-width:760px){
  body .vyb .sozd-polja{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  body .vyb .sozd-polja.odna{grid-template-columns:minmax(0,1fr) !important}
  body .vyb .sozd-vvod{font-size:17px !important}
}
                                                                
</style></head><body>
<div id="menju"></div>
<div class="wrap"><div class="vt">
  <div class="vt-z">Окна Locus</div>
  <div class="vt-p">Каждый сценарий открывается живым окном, один
    в один как в системе, на вебе и на телефоне. Сохранение здесь
    выключено: жми смело. У каждого окна своя ссылка – её можно
    переслать с вердиктом</div>
  <div id="spisok"></div>
  <div id="vt-sozd-mesto"></div>
</div></div>
<script src="/js/nedeli.js"></script>
<script src="/js/api.js"></script>
<script src="/js/obschij.js"></script>
<script>
(function () {
'use strict';

                                                      
['sozdat', 'pravit', 'dejstvie', 'udalit'].forEach((m) => {
  API[m] = async () => {
    O.tost('Это витрина: сохранение выключено');
    throw new Error('витрина');
  };
});

const GRUPPY = [
  ['Задачи', [
    ['sozdanie', 'Карточка создания задачи', 'сегменты подзадач, поля с подписями, низ со скрепкой и шаблонами'],
    ['podzadacha', 'Подзадача вкладкой', 'та же карточка, добавлена вкладка подзадачи'],
  ]],
  ['Люди', [
    ['istochniki', 'По источникам', 'аналитика: лиды, клиенты и деньги по каждому источнику'],
    ['v-rassylku', 'Сделать рассылкой', 'отбор фильтрами становится рассылкой, волна задачей'],
    ['chelovek', 'Новый человек', 'настоящая форма: все поля, плюс-кругляш за карточкой'],
    ['napr-chel', 'Направление человека', 'направление и роль из списков'],
    ['kontakt', 'Новый контакт', 'значение и вид, маска телефона на виде «телефон»'],
    ['svjaz', 'Новая связь', 'с кем и тип связи, заметка на будущее'],
    ['material', 'Новый материал', 'название, ссылка, файл скрепкой'],
    ['dokument', 'Новый документ', 'вид, номер, дата, ссылка или файл'],
    ['kasanie', 'Следующее касание', 'завтра, послезавтра или своя дата'],
    ['kas-data', 'Своя дата касания', 'второй шаг: календарь'],
    ['stadija', 'Своя стадия', 'название, тумблер общего набора, область'],
  ]],
  ['Проекты и деньги', [
    ['proekt', 'Новый проект', 'название линией, направление, клиент, ведущий, стоимость'],
    ['proekty-okno', 'Окно проектов', 'срезы с ведущим и без, поиск, список из Пространства'],
    ['oplata', 'Пришла оплата', 'сумма и дата, развилка частичной оплаты'],
    ['zavershit', 'Завершить проект', 'хвосты числами, судьба открытых задач'],
    ['arhiv', 'Проект в архив', 'что изменится, два выхода словами'],
    ['vernut-arhiv', 'Вернуть проект из архива', 'обратная сторона архива, два выхода словами'],
  ]],
  ['Направления', [
    ['usluga', 'Услуга направления', 'название, описание, цена, ссылка'],
    ['rassylka', 'Новая рассылка', 'название и выбор базы сегментами'],
    ['rassylka-ljudi', 'Рассылка из отбора людей', 'название и направление, состав с экрана'],
    ['komu-pisat', 'Кому писать', 'срезы базы рассылки с числами, волна задачей'],
    ['cel-tezis', 'Цель из тезиса стратегии', 'тезис перед глазами, название цели'],
  ]],
  ['Планёрка', [
    ['sravnit-nedeli', 'Сравнить недели', 'два спринта рядом: задачи, лиды, деньги, публикации'],
  ]],
  ['ОКР', [
    ['rezultat', 'Результат цели', 'что меряем, сейчас и хотим'],
    ['zamer', 'Замер результата', 'число и откуда оно'],
    ['kvartaly', 'Разбить по кварталам', 'план по кварталам со сверкой суммы'],
    ['prikrepit', 'Прикрепить задачу к цели', 'поиск по свободным задачам, клик прикрепляет'],
    ['udalit-cel', 'Удалить цель', 'что уйдёт вместе с ней, отказ словами'],
  ]],
  ['Полезное', [
    ['shablon-prosmotr', 'Просмотр шаблона', 'поля шаблона и чего он не хранит'],
    ['shablon-novyj', 'Новый шаблон', 'чипы типов, сроков и факта, описание, подзадачи'],
  ]],
];

function spisok() {
  let i = 0;
  document.getElementById('spisok').innerHTML = GRUPPY.map(([g, sc]) =>
    `<div class="vt-g">${g}</div>` + sc.map(([kod, imja, p]) => {
      i += 1;
      return `<div class="vt-s">
        <span class="vt-n">${String(i).padStart(2, '0')}</span>
        <span class="vt-im">${imja}<div class="p">${p}</div></span>
        <span style="white-space:nowrap"><a class="vt-kn" data-okno="${kod}">открыть</a><a
          class="vt-ssyl" href="?okno=${kod}">ссылка</a></span>
      </div>`;
    }).join('')).join('');
  document.querySelectorAll('[data-okno]').forEach((e) =>
    e.addEventListener('click', () => otkryt(e.dataset.okno)));
}

                                                                  
function zhivojSpisok(id, punkty, tekuschij) {
  const b = document.getElementById(id);
  if (!b) return;
  O.vypadajuschij(b, punkty, tekuschij || '').addEventListener('click', (ev) => {
    const pnt = ev.target.closest('.vyp-p'); if (!pnt) return;
    const v = punkty.find((x) => String(x.kod) === String(pnt.dataset.kod));
    const tt = b.querySelector('.sozd-t');
    if (tt && v) { tt.textContent = v.imja; b.classList.add('vybrano'); }
  });
}

function segmenty(id) {
  document.getElementById(id)?.addEventListener('click', (ev) => {
    const e = ev.target.closest('.vid-e'); if (!e) return;
    document.querySelectorAll(`#${id} .vid-e`).forEach((x) => x.classList.remove('on'));
    e.classList.add('on');
  });
}

let SPRAV = { napravlenija: [], ljudi: [] };
const dirs = () => SPRAV.napravlenija.map((n) => ({ kod: n.kod, imja: n.imja }));
const lica = () => SPRAV.ljudi.map((l) => ({ kod: String(l.id), imja: l.imja }));

                                                              
                                                                
                                                         
const K = {
  vyp: (id, podpis, ob) => `<span class="sozd-p vyp"><span class="sozd-lbl">${podpis}${
    ob ? '<i class="sozd-ob" title="обязательное">*</i>' : ''}</span>
    <a class="sozd-pole" id="${id}"><span class="sozd-t"></span><span class="str"></span></a></span>`,
  vvod: (id, podpis, { tip = 'text', znach = '', im = '', ob = false } = {}) =>
    `<span class="sozd-p"><span class="sozd-lbl">${podpis}${
      ob ? '<i class="sozd-ob" title="обязательное">*</i>' : ''}</span>
    <label class="sozd-pole${tip === 'date' ? ' pole-daty' : ''}"><input id="${id}" type="${tip}"${
      znach !== '' ? ` value="${znach}"` : ''}${im ? ` inputmode="${im}"` : ''}${
      tip === 'date' && znach === '' ? ' class="pusto"' : ''} autocomplete="off"></label></span>`,
  opis: (id, podpis) => `<span class="sozd-lbl">${podpis}</span>
    <textarea class="sozd-opis" id="${id}" rows="1"></textarea>`,
  polja: (vnutri, kl = '') => `<div class="sozd-polja ${kl}">${vnutri}</div>`,
  imja: (id, mesto, znach = '') => `<input class="sozd-vvod" id="${id}" placeholder="${mesto}"${
    znach ? ` value="${znach}"` : ''} autocomplete="off">`,
  varianty: (id, spisok) => `<div class="k-varianty" id="${id}">${spisok.map(([k, i]) =>
    `<a class="k-var" data-kv="${k}"><i></i>${i}</a>`).join('')}</div>`,
  pojasn: (tekst, id = '') => `<div class="k-poyasn"${id ? ` id="${id}"` : ''}>${tekst}</div>`,
};
                                                              
                                                      
function vkljuchitVarianty(id, posle) {
  document.getElementById(id)?.addEventListener('click', (ev) => {
    const v = ev.target.closest('.k-var'); if (!v) return;
    const byl = v.classList.contains('on');
    document.querySelectorAll(`#${id} .k-var`).forEach((x) => x.classList.remove('on'));
    if (!byl) v.classList.add('on');
    if (posle) posle(byl ? null : v.dataset.kv);
  });
}
                                                               
function vkljuchitDaty() {
  document.querySelectorAll('.vyb .pole-daty input').forEach((i) =>
    i.addEventListener('change', () => i.classList.toggle('pusto', !i.value)));
}
const GOTOVO = (podskazka, znak) => ({ gotovo: async () => {}, podskazka, ...(znak ? { znak } : {}) });

const OKNA = {

  sozdanie() { kartaSozd(); },
  podzadacha() {
    kartaSozd();
    setTimeout(() => {
      const im = document.getElementById('sozd-imja');
      if (im) { im.value = 'Правки КП Технопродукту'; im.dispatchEvent(new Event('input')); }
                                                                
                                             
      document.getElementById('sozd-napr')?.click();
      setTimeout(() => {
        document.querySelector('#sozd-napr')?.parentElement
          .querySelector('.vyp-p[data-kod="synapt"], .vyp-p:not([data-snjat])')?.click();
        document.querySelector('[data-sgm-dob]')?.click();
      }, 120);
    }, 150);
  },

  chelovek() {
                                                                
                                                            
    O.modalka('Новый человек', `<div class="okno-kanon">
      ${K.imja('ch-imja', 'Имя')}
      ${K.polja(K.vyp('ch-napr', 'направление') + K.vyp('ch-rol', 'роль') + K.vyp('ch-otkuda', 'откуда'))}
      ${K.polja(K.vvod('ch-tg', 'телеграм') + K.vvod('ch-pochta', 'почта', { tip: 'email' })
        + K.vvod('ch-tel', 'телефон', { tip: 'tel' }))}
      ${K.polja(K.vvod('ch-gorod', 'город') + K.vvod('ch-nisha', 'ниша') + K.vyp('ch-kto', 'кто привёл'))}
      ${K.opis('ch-zam', 'заметка')}</div>`, null, GOTOVO('добавить человека', '+'));
    zhivojSpisok('ch-napr', dirs(), '');
    zhivojSpisok('ch-rol', [['lid', 'лид'], ['klient', 'клиент'], ['podrjadchik', 'подрядчик'],
      ['partner', 'партнёр']].map(([k, i]) => ({ kod: k, imja: i })), '');
    zhivojSpisok('ch-otkuda', [['rekomendacija', 'рекомендация'], ['rassylka', 'рассылка'],
      ['meroprijatie', 'мероприятие'], ['sajt', 'сайт'], ['socseti', 'соцсети']]
      .map(([k, i]) => ({ kod: k, imja: i })), '');
    zhivojSpisok('ch-kto', lica(), '');
  },

  'napr-chel'() {
    const roli = [{ kod: 'lid', imja: 'лид' }, { kod: 'klient', imja: 'клиент' },
      { kod: 'podrjadchik', imja: 'подрядчик' }, { kod: 'partner', imja: 'партнёр' }];
    O.modalka('Направление человека', `<div class="okno-kanon">
      ${K.polja(K.vyp('s-napr', 'направление', true) + K.vyp('s-rol', 'роль', true), 'dve')}
      <div class="fch-niz"><span class="fch-osh" id="s-osh"></span></div></div>`,
      null, GOTOVO('добавить направление', '+'));
    zhivojSpisok('s-napr', dirs(), '');
    zhivojSpisok('s-rol', roli, '');
  },

  kontakt() {
    O.modalka('Новый контакт', `<div class="okno-kanon">
      ${K.polja(K.vyp('k-vid', 'вид', true) + K.vvod('k-znach', 'значение', { ob: true }), 'dve')}
      ${K.pojasn('телефон хранится как +79161234567, показывается с маской; код страны распознаётся из вставки', 'k-maska')}
      </div>`, null, GOTOVO('добавить контакт', '+'));
    document.getElementById('k-maska').hidden = true;
    zhivojSpisok('k-vid', [
      { kod: 'telegram', imja: 'телеграм' }, { kod: 'telefon', imja: 'телефон' },
      { kod: 'pochta', imja: 'почта' }, { kod: 'drugoe', imja: 'другое' },
    ], '');
    document.getElementById('k-vid')?.parentElement.addEventListener('click', (ev) => {
      const p = ev.target.closest('.vyp-p'); if (!p) return;
      document.getElementById('k-maska').hidden = p.dataset.kod !== 'telefon';
    });
  },

  svjaz() {
    O.modalka('Новая связь', `<div class="okno-kanon">
      ${K.pojasn('кто и как связан с Виктором: знакомство, рекомендация или совместная работа')}
      ${K.polja(K.vyp('sv-kto', 'с кем', true) + K.vyp('sv-tip', 'как связаны', true), 'dve')}
      ${K.opis('sv-zam', 'заметка')}</div>`, null, GOTOVO('добавить связь', '+'));
    zhivojSpisok('sv-kto', lica(), '');
    zhivojSpisok('sv-tip', [['znaet', 'знает'], ['rekomendoval', 'рекомендовал'],
      ['rabotal', 'работал вместе'], ['privjol', 'привёл']]
      .map(([k, i]) => ({ kod: k, imja: i })), '');
  },

  material() {
    O.modalka('Новый материал', `<div class="okno-kanon">
      ${K.imja('m-nazv', 'Материал')}
      ${K.polja(K.vvod('m-ssyl', 'ссылка', { tip: 'url' }), 'odna')}
      <div class="fch-niz"><a class="kon-dob" id="m-fajl">📎 прикрепить файл</a>
        <span class="fch-osh" id="m-osh"></span></div></div>`,
      null, GOTOVO('добавить материал', '+'));
  },

  dokument() {

function otkryt(kod) {
  history.replaceState(null, '', '?okno=' + kod);
  if (kod !== 'sozdanie' && kod !== 'podzadacha') {
    const m = document.getElementById('vt-sozd-mesto');
    if (m) m.innerHTML = '';
  }
  (OKNA[kod] || (() => O.tost('Такого окна в витрине нет')))();
}

(async function start() {
  SPRAV = await SPR.zagruzit();
  window.DANNYE = { napravlenija: SPRAV.napravlenija, ljudi: SPRAV.ljudi,
                    statusy: SPRAV.statusy, tipy: SPRAV.tipy, zadachi: [],
                    shablony: [], celi: [], klienty: [], proekty: [] };
  document.getElementById('menju').innerHTML = O.menju('okna');
  spisok();
  O.vkljuchitSkvoznoe();
  const srazu = new URLSearchParams(location.search).get('okno');
  if (srazu) setTimeout(() => otkryt(srazu), 300);
})();
})();
</script>
