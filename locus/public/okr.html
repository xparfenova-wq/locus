</style></head><body>
<div id="menju"></div>

  <div class="okr-dve">

</div></div>

<script>
(function () {
                                                                 
                                                              
                                                                  
                                             
let SPRAV = null, VSE_CELI = [], CELI = [], otkrytye = new Set();
let goalEditor,periodPlanner;

                                                         
function skl(n, odna, dve, pjat) {
  const d = n % 10, st = n % 100;
  if (st >= 11 && st <= 14) return pjat;
  if (d === 1) return odna;
  if (d >= 2 && d <= 4) return dve;
  return pjat;
}

                                                                   
                                                                            
function progress(c) { return c.procent ?? null; }

                                                               
                                          
function sobrat_menju() {
  if (VSTROEN) { document.getElementById('menju').innerHTML = ''; return; }
                                                               
                                                                
  document.getElementById('menju').innerHTML = O.menju('Направления', {
    napravlenija: true,
    chisla: celej_po_napravlenijam(),
    period: [nazvanie_perioda(shownPeriod()), SPR.period(shownWindow()?.okno.nachalo||OKR.nachalo, shownWindow()?.okno.konec||OKR.konec)],
    dejstvie: vid_perioda(),
                                                             
                                  
    sprint: sprint_perekljuchatel(),
    mobilnyj_period: true,
  });
}

                                                         
                                                               
function sprint_perekljuchatel() {
  if (!OKR || !OKR.sprint) return null;
  const segodnja = SPR.segodnja();
  const vid = !den_okr || (den_okr >= OKR.nachalo_sprinta && den_okr <= OKR.konec_sprinta
                           && OKR.nachalo_sprinta <= segodnja && OKR.konec_sprinta >= segodnja)
    ? 'сейчас'
    : OKR.konec_sprinta < segodnja ? 'как было' : 'прогноз';
  return [`спринт ${OKR.sprint}`, vid];
}

                                                                  
function sdvinut_sprint(shag) {
  const ot = den_okr || SPR.segodnja();
  den_okr = SPR.kalendar.sdvinut_den(ot,shag*7);
  const u = new URL(location.href);
  u.searchParams.set('den', den_okr);
  history.replaceState(null, '', u);
}

                                                               
const OKR_QUERY=window.LocusTaskRoute.query(location.href);
let period_id = OKR_QUERY.get('period') || 'sejchas';
                                                              
                                                            
const CEL_IZ_ADRESA = Number(OKR_QUERY.get('cel')) || null;
let selectedGoalId=CEL_IZ_ADRESA;
let view_period=OKR_QUERY.get('okno')||null;
let windowReadError=null;
let cel_slajd=CEL_IZ_ADRESA;
let nabljudatel_celej;
                                                                
                                                             
const VSTROEN = new URLSearchParams(location.search).get('vstroen') === '1';
const NAPR_IZ_ADRESA = new URLSearchParams(location.search).get('napravlenie') || '';
if (VSTROEN) document.body.dataset.vstroen = '1';

                                                                 
                                                            
                                 
  
                                                                   
                                                                  
                                                                 
                                                               
                                                         
               
let den_okr = new URLSearchParams(location.search).get('den') || null;

                                                                     
                                                               
                                  
let OKR = null,loadGeneration=0;
async function zagruzit() {
  const generation=++loadGeneration;
  const goalId=selectedGoalId,wantedWindow=view_period;
  let references,screen;
  try{
    [references,screen]=await Promise.all([SPR.zagruzit(),API.ekran('okr',{period:period_id,...(goalId?{cel:goalId,...(wantedWindow?{okno:wantedWindow}:{})}:{}),...(den_okr?{den:den_okr}:{})})]);
    if(generation!==loadGeneration)return;
    if(goalId&&wantedWindow&&!LocusGoalWindow.selected(screen.celi?.find(goal=>goal.id===goalId),wantedWindow))throw new Error('Ответ не подтвердил выбранную цель и временной срез');
  }catch(error){
    if(generation!==loadGeneration)return;
    if(goalId&&wantedWindow){windowReadError={period:wantedWindow,message:error.message,denied:[401,403,404].includes(error.kod)};if(windowReadError.denied){if(OKR)OKR.celi=[];VSE_CELI=[];CELI=[];}}
    throw error;
  }
  if(generation!==loadGeneration)return;
  windowReadError=null;
  SPRAV=references;OKR=screen;
  window.DANNYE={napravlenija:SPRAV.napravlenija,ljudi:SPRAV.ljudi,statusy:SPRAV.statusy,tipy:SPRAV.tipy,zadachi:[]};
  VSE_CELI=OKR.celi||[];CELI=VSE_CELI;
}

                                                             
let fSrez = '';
                                                                 
let fNapr = new URLSearchParams(location.search).get('napravlenie') || '';

                                                                           
const SLOVAMI = { po_grafiku: '', otstaem: 'отстаём', pod_ugrozoj: 'под угрозой',net_dannyh:'нет замера' };

                                                                            
const za_sprint=c=>c.skryto?.includes('dengi')?null:(c.dvizhenie_sprinta??null);
let deletionController;

function narisovat() {
  renderWindowState();
  if(windowReadError?.denied){document.getElementById('celi').replaceChildren();document.getElementById('novaja').replaceChildren();return;}
  const draftName=document.getElementById('n-imja')?.value;
  const draftDirection=document.getElementById('n-napr')?.value;
  const draftThesis=document.getElementById('n-tezis')?.value||'';
  const draftKey=document.querySelector('#novaja .nov-obj')?.dataset.okrCreationKey||crypto.randomUUID();
  deletionController=LocusOkrDelete.mount(document.getElementById('okr-deletion-state'),{API,O,beforeDelete:action=>{if(action.table==='celi'&&selectedGoalId===action.id)adres();},onChanged:async action=>{ZADACHI_CELI.clear();if(action?.kind==='restore'&&action.result?.sostojanie==='vosstanovleno'){const restored=action.result;cel_slajd=restored.cel_id;otkrytye.add(restored.cel_id);if(restored.period_id&&restored.period_id!==OKR.period){period_id=restored.period_id;den_okr=null;}if(fNapr&&fNapr!==restored.napravlenie)fNapr=restored.napravlenie;adres();}await zagruzit();narisovat();obnovitShapku();}});
                                                     
  CELI = fNapr ? VSE_CELI.filter((c) => c.napravlenie === fNapr) : VSE_CELI;

  const sred = CELI.length
    ? CELI.some(c=>progress(c)==null)?null:Math.round(CELI.reduce((s, c) => s + progress(c), 0) / CELI.length) : 0;
                                                                       
                                                                      
  const otstajut = CELI.filter((c) => c.status_celi !== 'po_grafiku').length;
  const rezultatov = CELI.reduce((s, c) => s + c.rezultaty.length, 0);
                                                                 
                                                  
  const bez_rez = CELI.filter((c) => !c.rezultaty.length).length;

                                                               
                                                                    
  const plitka = (srez, podpis, chislo, edinica, pojasnenie, krasnoe) =>
    `<a class="plt-k${srez !== null && fSrez === srez ? ' on' : ''}"${
      srez === null ? '' : ` data-srez="${srez}"`}>
      <span class="plt-l">${podpis}</span>
      <span class="plt-c${krasnoe ? ' kr' : ''}">${chislo}${
        edinica ? `<i class="iz">${edinica}</i>` : ''}</span>
      <span class="plt-d">${pojasnenie}</span></a>`;

                                                               
                                                              
                                                         

                                                                        
  const vidimye = CELI.filter((c) => {
    if (fSrez === 'otstajut') return c.status_celi !== 'po_grafiku';
    if (fSrez === 'bez_rezultatov') return !c.rezultaty.length;
    if (fSrez === 'ustareli') return c.rezultaty.some((r) => r.ustarel);
    return true;
  });

  document.getElementById('okr-fact-context').textContent=OKR.istoricheskij?'Факты на '+OKR.na_datu+' по текущим целям и планам. Если истории нет, значение не рассчитано. Сохранённые итоги недели — в планёрках.':den_okr&&den_okr>SPR.segodnja()?'Ожидание на '+den_okr+'. Факты известны на '+OKR.na_datu+'; будущие результаты не предсказаны.':'';
  document.getElementById('celi').innerHTML = vidimye.length ? vidimye.map((c) => {
    const p = progress(c);
    const otkr = otkrytye.has(c.id);
    const napr = SPRAV.napravlenija.find((n) => n.kod === c.napravlenie);
    const sprint = za_sprint(c);
    return `<div class="cel${otkr ? ' otkr' : ''}" data-id="${c.id}">
      <div class="cel-sh${c.status_celi === 'pod_ugrozoj' ? ' ugroza' : ''}${
        sprint === 0 ? ' tiho' : ''}" data-tog="${c.id}">
        <span class="cel-doli">${c.skryto?.includes('dengi')||c.procent==null ? '—' : `${p}<i class="slovo">%</i>`}</span>
        <span class="cel-im">${O.ekranirovat(c.nazvanie)}${O.entityCopyLink('/okr/'+c.id)}${c.nepolnaja?'<small class="goal-incomplete">цель неполная: нужно минимум два результата</small>':''}${c.podskazka?'<small class="goal-incomplete">'+O.ekranirovat(c.podskazka)+'</small>':''}<span class="cel-f">${
          napr ? O.ekranirovat(napr.imja) : ''}${c.otkrytyh_zadach
            ? ', ' + c.otkrytyh_zadach + ' ' + skl(c.otkrytyh_zadach,
                'открытая задача', 'открытые задачи', 'открытых задач') : ''}</span></span>
        <span class="cel-vl">${SLOVAMI[c.status_celi] || ''}</span>
        <!-- Полосы с процентами убраны: её слова 28 октября —
             «мне не нравятся эти полосочки, блоки с процентами,
             мне некрасиво от них в разделе ОКР». Число слева
             уже говорит, насколько цель закрыта, а отставание
             от графика сказано словами справа -->
        <span class="cel-ch">
          <span class="cel-sp">${c.skryto?.includes('dengi') ? 'денежный блок скрыт' : sprint === null ? 'нет сравнения за неделю'
            : sprint > 0 ? `+${sprint}% за спринт`
            : sprint < 0 ? `${sprint}% за спринт`
            : 'без движения'}</span>
        </span>
        <span class="cel-str"></span>
      </div>
      <div class="cel-telo">
        <div class="goal-edit-toolbar"><button type="button" class="kn" data-goal-edit="${c.id}">сведения о цели</button></div>
        ${c.strategija?.udalen?'<p class="measurement-latest">Связанный тезис стратегии удалён</p>':c.strategija?.url?`<p class="goal-strategy-source">из стратегии: <a href="${O.ekranirovat(c.strategija.url)}" data-goal-strategy-source>${O.ekranirovat(c.strategija.tekst)}</a></p>`:'<p class="measurement-latest">Без опоры на стратегию</p>'}
        ${c.rezultaty.length ? `<div class="rez rez-sh">
          <span>результат</span><span>факт</span><span>план</span>
          <span>доля</span><span></span></div>` : ''}
        ${c.rezultaty.map((r) => {
          if (r.skryto?.includes('dengi')) return `<div class="rez" data-rez="${r.id}">
            <span class="rez-n">${O.ekranirovat(r.nazvanie)}</span>
            <span class="rez-sam">денежный блок скрыт</span></div>`;
          const view=selectedGoalId===c.id&&view_period?LocusGoalWindow.selected(c):null;
          if(view&&view.okno.period!==String(c.period_id))return windowResult(c,r,view);
          const dolja = r.progress_pct;
          const historical=r.na_datu<SPR.segodnja();
          const manual=r.tip!=='veha'&&(r.istochnik??'ruchnoj_zamer')==='ruchnoj_zamer',last=r.zamery?.[0];
          const leadMode=r.schitaetsja_sam&&['lidov','novyh_lidov','lidov_ot_referalov'].includes(r.formula);
          return `<div class="rez${r.ustarel ? ' ust' : ''}" data-cel="${c.id}" data-rez="${r.id}">
            <span class="rez-n"${leadMode?` role="button" tabindex="0" data-lead-mode="${r.id}" title="изменить, каких лидов считать"`:""}>${O.ekranirovat(r.nazvanie)}${r.schitaetsja_sam
              ? '<span class="rez-sam">считается само</span>'+(leadMode?'<br><span class="rez-pod">'+(r.schitat_lidov==='vse'?'все, с кем работали':'только новые')+'</span>':'')
              : r.istochnik === 'akkaunt'
                ? '<span class="rez-sam">из аккаунта</span>'
                : r.ustarel
                ? `<span class="ust-p">замер ${r.dnej_bez_zamera} ${
                    skl(r.dnej_bez_zamera, 'день', 'дня', 'дней')} назад</span>` : ''}${r.polnota_dannyh&&!r.polnota_dannyh.polnaja
                ? `<span class="rez-ist">Учтены подтверждённые переходы. Без полной истории: ${r.polnota_dannyh.bez_istorii}</span>` : ''}${r.polnota_publikacij&&r.formula==='ohvat_publikacij'?`<small class="measurement-latest" data-publication-coverage>Подтверждённый охват: ${O.ekranirovat(r.polnota_publikacij.izvestnyj_ohvat??'—')}; охват по ${O.ekranirovat(r.polnota_publikacij.ohvat_po)} из ${O.ekranirovat(r.polnota_publikacij.ohvat_iz)}${r.polnota_publikacij.bez_istorii?`; ещё требуют проверки: ${O.ekranirovat(r.polnota_publikacij.bez_istorii)}`:''}</small>`:''}${!manual&&r.obnovleno?`<small class="measurement-latest">данные от ${O.ekranirovat(r.obnovleno)}</small>`:''}${r.pochemu_net_fakta?`<small class="measurement-latest">${O.ekranirovat(r.pochemu_net_fakta)}</small>`:''}${manual?`<small class="measurement-latest">${last?O.ekranirovat(last.data)+' · '+O.ekranirovat(last.kto_imja||'автор не указан')+' · '+O.ekranirovat(typeof last.otkuda==='string'?last.otkuda:'источник в старом формате'):'Замеров пока нет'}</small><span class="measurement-actions"><button type="button" class="kn" data-new-measure="${r.id}">добавить замер</button><button type="button" class="kn" data-measure-history="${r.id}">все замеры</button></span>`:''}</span>
            ${r.tip==='veha'&&historical?`<span class="rez-c">${r.fakt===null?'нет данных':r.fakt?'закрыта':'не закрыта'}</span>`:r.tip==='veha'?`<span class="rez-c"><button type="button" class="kn milestone-state" role="checkbox" aria-checked="${!!r.zakryta}" data-milestone-state="${r.id}">${r.zakryta?'закрыта':'не закрыта'}</button></span>`:r.istochnik==='formula'||r.istochnik==='akkaunt'||historical
              ? `<span class="rez-c sam" title="число берётся из источника">${O.ekranirovat(r.fakt??'—')}</span>`
              : `<span class="rez-c vvod" contenteditable="true" data-pole="fakt">${O.ekranirovat(r.fakt??'')}</span>`}
            ${r.tip==='veha'?'<span class="rez-c">—</span>':`<span class="rez-c vvod" contenteditable="true" data-pole="plan">${O.ekranirovat(r.plan??'')}</span>`}
            <span class="rez-c${dolja!=null&&dolja < 50 ? ' kr' : ''}">${dolja==null?'—':dolja+'%'}${r.tip!=='veha'?`<small class="rez-base-unknown">${r.baza_ne_zadana?'база не задана':'база: '+O.ekranirovat(r.baza)}<button type="button" class="kn" data-base-edit="${r.id}">${r.baza_ne_zadana?'задать':'изменить'}</button></small>`:''}${
              r.dvizhenie_nedeli ? `<i class="rez-ned">${r.dvizhenie_nedeli>0?'+':''}${r.dvizhenie_nedeli} за неделю</i>`
                : r.dvizhenie_nedeli === 0 ? '<i class="rez-ned tiho">без движения</i>' : ''}</span>
            <a class="udal" data-ur="${r.id}" data-cel="${c.id}" title="удалить результат">×</a>
          </div>${r.tip === 'veha' && !r.zakryta ? `<div class="veha-d">
            <a class="sdel-z" data-sz="${r.id}" data-cel="${c.id}">сделать задачей</a>
            <span class="veha-p">закроешь задачу, веха закроется сама</span>
          </div>` : ''}`;
        }).join('')}
        ${c.rezultaty.length ? '' : `<div class="rez-net">
          Прогресс цели считается по её результатам. Пока ни одного нет,
          цель так и будет стоять на нуле</div>`}
        <div class="rez-niz">
          <a class="kn tmn dob-r" data-dr="${c.id}">+ добавить результат</a>
          ${c.prava_celi?.mozhno_pravit&&/^\d{4}(?:-Q[1-4])?$/.test(String(c.period_id || ''))
            ? `<button type="button" class="kn po-kv" data-kv="${c.id}">${String(c.period_id).includes('Q')?'разбить по месяцам':'разбить по кварталам'}</button>` : ''}
          <span class="rez-pod">у результата есть план и факт, доля считается сама</span>
          <i></i>
          ${c.prava_celi?.mozhno_pravit?`<a class="udal-c" data-uc="${c.id}">удалить цель</a>`:''}
        </div>
        <!-- Задачи цели. Её слова 25 октября: «как мне тут задачу-то
             прикрепить?» Раньше число открытых задач стояло в шапке
             цели, а посмотреть их и привязать новую было негде -->
        <div data-goal-state="${c.id}"></div>
        <div data-goal-history="${c.id}"></div>
        <div class="zad-blok" data-zadachi="${c.id}">
          <div class="zad-z">задачи цели</div>
          <div class="zad-sp">грузятся</div>

            <a class="kn pri-z" data-pz="${c.id}">+ прикрепить задачу</a>
          </div>
        </div>
      </div>
    </div>`;

function narisovatTochkiCelej(skolko) {
  const mesto = document.getElementById('cel-tochki');
  const sp = document.getElementById('celi');
  if (!mesto || !sp) return;
  mesto.innerHTML = skolko > 1 ? Array.from({ length: skolko }, (_, i) =>
    `<a data-ct="${i}"${i === 0 ? ' class="on"' : ''} aria-label="цель ${i + 1}"></a>`).join('') : '';
  const tochki = mesto.querySelectorAll('[data-ct]');
  if (!sp.dataset.tochki) {
    sp.dataset.tochki = '1';
    sp.addEventListener('scroll', () => {
      const tek = Math.round(sp.scrollLeft / (sp.clientWidth || 1));
      const card=sp.querySelectorAll(':scope>.cel')[tek];
      if(card)cel_slajd=Number(card.dataset.id);
      visota_slajda();
      document.querySelectorAll('#cel-tochki [data-ct]')

const ZADACHI_CELI = new Map(),TASK_READ_ERRORS=new Map(),TASK_READ_GENERATIONS=new Map();

async function zagruzit_zadachi(cel_id) {
  const generation=(TASK_READ_GENERATIONS.get(cel_id)||0)+1;TASK_READ_GENERATIONS.set(cel_id,generation);
  try {
    const o = await API.zapros('GET','/okr/zadachi?cel='+cel_id);
    if(!Array.isArray(o.spisok))throw new Error('Не удалось прочитать задачи цели');
    if(TASK_READ_GENERATIONS.get(cel_id)!==generation)return;
    ZADACHI_CELI.set(cel_id,o.spisok);TASK_READ_ERRORS.delete(cel_id);
  } catch(error) { if(TASK_READ_GENERATIONS.get(cel_id)===generation){ZADACHI_CELI.delete(cel_id);TASK_READ_ERRORS.set(cel_id,error.message);} }
}

function narisovat_zadachi(cel_id) {
  const blok = document.querySelector(`[data-zadachi="${cel_id}"] .zad-sp`);
  if (!blok) return;
  if(TASK_READ_ERRORS.has(cel_id)){blok.innerHTML='<p class="measurement-latest">'+O.ekranirovat(TASK_READ_ERRORS.get(cel_id))+'</p><button class="kn" type="button" data-goal-tasks-retry>повторить загрузку</button>';blok.querySelector('button').onclick=async()=>{TASK_READ_ERRORS.delete(cel_id);blok.textContent='Загрузка задач';await zagruzit_zadachi(cel_id);narisovat_zadachi(cel_id);};return;}
  const sp = ZADACHI_CELI.get(cel_id);
  if (!sp) { blok.innerHTML = '<div class="zad-net">грузятся</div>'; return; }
  blok.innerHTML = sp.length ? sp.map((z) => `<div class="zad-s">
      <a class="im" data-goal-task-open="${z.nomer}" href="/${encodeURIComponent(z.napravlenie||'zadachi')}/${z.nomer}">${O.ekranirovat(z.nazvanie)}</a>
      <span class="st">${O.statusPoKodu
        ? (O.statusPoKodu(z.status)?.imja || z.status || '') : (z.status || '')}</span>
      <span class="dt">${z.srok ? SPR.data(z.srok) : '—'}</span>
      <a class="otc-z" data-otc="${z.nomer}" data-cel="${cel_id}"
         title="открепить от цели">×</a>
    </div>`).join('')
    : `<div class="zad-net">К цели не прикреплено ни одной задачи.
       Прикрепи те, которыми её двигаешь: по ним будет видно,
       чем цель закрывается, а не только числом в результате</div>`;
  privjazat_zadachi(cel_id);
}

function privjazat_zadachi(cel_id) {
  document.querySelectorAll(`[data-zadachi="${cel_id}"] [data-goal-task-open]`).forEach(link=>link.addEventListener('click',event=>{if(event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();O.otkrytZadachu(Number(link.dataset.goalTaskOpen),null,location.pathname+location.search+location.hash).catch(error=>O.tost(error.message));}));
  document.querySelectorAll(`[data-zadachi="${cel_id}"] [data-otc]`).forEach((e) =>
    e.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const nomer = Number(e.dataset.otc);
      try {
        const seen=(ZADACHI_CELI.get(cel_id)||[]).find(z=>z.nomer===nomer);
        if(!seen)throw new Error('Обнови список задач цели');
        const previous={cel_id:seen.cel_id,rezultat_id:seen.rezultat_id};
        const saved=await API.pravit('zadachi',nomer,{versija:seen.versija,cel_id:null,rezultat_id:null});
        await zagruzit_zadachi(cel_id);
        await zagruzit();narisovat();
        O.tost('Задача откреплена от цели',async()=>{
          await API.pravit('zadachi',nomer,{versija:saved.versija,...previous});
          await zagruzit_zadachi(cel_id);await zagruzit();narisovat();
        });
      } catch (err) { O.tost('Не получилось: ' + err.message); }
    }));
}

                                                                     
                                                           
async function prikrepit_zadachu(cel) {
                                                              
                                                        
  let vse = [];
  try {
    let stranica = 1, stranic = 1;
    do {
      const o = await API.ekran('zadachi', { stranica });
      vse = vse.concat(o.spisok || []);
      stranic = o.stranic || 1;
      stranica += 1;
    } while (stranica <= stranic && stranica <= 20);
  } catch { vse = []; }
                                                                
                     
  const svobodnye = vse.filter((z) => !z.cel_id
    && !z.udaleno && z.status !== 'sdelano');

  const stroka = (z) => `<a class="vyb-z-s" data-vz="${z.nomer}">
    <span class="im">${z.nazvanie}</span>
    <span class="np">${O.naprPoKodu(z.napravlenie)?.imja || ''}</span></a>`;

  O.modalka(`Прикрепить задачу к цели «${cel.nazvanie}»`, `
    <input class="vyb-z-pole" id="vz-poisk" placeholder="найти задачу" autofocus>
    <div class="vyb-z-sp" id="vz-sp">${svobodnye.length
      ? svobodnye.map(stroka).join('')
      : '<div class="zad-net">Свободных задач нет: все уже прикреплены к целям</div>'}</div>`,
    (zakryt) => {
      const poisk = document.getElementById('vz-poisk');
      poisk?.focus();
      poisk?.addEventListener('input', () => {
        const q = poisk.value.trim().toLowerCase();
        const vidno = q ? svobodnye.filter((z) =>
          String(z.nazvanie).toLowerCase().includes(q)) : svobodnye;
        document.getElementById('vz-sp').innerHTML = vidno.length
          ? vidno.map(stroka).join('')
          : '<div class="zad-net">По этому слову ничего</div>';
      });
      document.getElementById('vz-sp')?.addEventListener('click', async (ev) => {
        const s = ev.target.closest('[data-vz]');
        if (!s) return;
        const nomer = Number(s.dataset.vz);
        zakryt();
        try {
          const seen=svobodnye.find(z=>z.nomer===nomer);
          if(!seen)throw new Error('Обнови список свободных задач');
          const saved=await API.pravit('zadachi',nomer,{versija:seen.versija,cel_id:cel.id,rezultat_id:null});
          otkrytye.add(cel.id);
          await zagruzit_zadachi(cel.id);await zagruzit();narisovat();
          O.tost('Задача прикреплена к цели',async()=>{
            await API.pravit('zadachi',nomer,{versija:saved.versija,cel_id:seen.cel_id,rezultat_id:seen.rezultat_id});
            await zagruzit_zadachi(cel.id);await zagruzit();narisovat();
          });
        } catch (err) { O.tost('Не получилось: ' + err.message); }
      });
    });
}

    event.stopPropagation();
    const result=CELI.flatMap(goal=>goal.rezultaty||[]).find(row=>row.id===Number(button.dataset.leadMode));
    if(result)LocusResultForm.lidy({rez:result,API,O,onChanged:async()=>{await zagruzit();narisovat();}});
  }));

  document.querySelectorAll('[data-dr]').forEach((e) => e.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const cel = CELI.find((c) => c.id === +e.dataset.dr);
    if (cel) sprositRezultat(cel);
  }));

                                                                      
  document.querySelectorAll('[data-kv]').forEach(button=>button.addEventListener('click',event=>{
    event.stopPropagation();const goal=CELI.find(row=>row.id===Number(button.dataset.kv));
    if(goal)periodPlanner.open(goal.id,String(goal.period_id));
  }));

  document.querySelectorAll('[data-pz]').forEach((e) => e.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const cel = CELI.find((c) => c.id === +e.dataset.pz);
    if (cel) prikrepit_zadachu(cel);
  }));
                                                             
                                                             
                                     
  document.querySelectorAll('[data-sz]').forEach((e) => e.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    if(e.dataset.saving)return;
    const cel = CELI.find((c) => c.id === +e.dataset.cel);
    const r = cel && cel.rezultaty.find((x) => x.id === +e.dataset.sz);
    if (!r) return;
    e.dataset.saving='1';e.setAttribute('aria-busy','true');
    let z;
    try { z=await API.dejstvie('/okr/vehi/'+r.id+'/zadachi',{}); }
    catch(err){O.tost('Не получилось создать задачу: '+err.message);}
    if(z){
      ZADACHI_CELI.delete(cel.id);
      try{
        await zagruzit_zadachi(cel.id);narisovat();
        O.tost(`Задача №${z.nomer} создана и привязана к вехе`);
      }catch{O.tost(`Задача №${z.nomer} создана. Список не обновился, обнови страницу`);}
    }
    delete e.dataset.saving;e.removeAttribute('aria-busy');
  }));
                                                                         
                                                              
  document.querySelectorAll('[data-zadachi]').forEach(async (e) => {
    const id = +e.dataset.zadachi;
    if (!ZADACHI_CELI.has(id)) { await zagruzit_zadachi(id); }
    narisovat_zadachi(id);
  });

  for(const node of document.querySelectorAll('[data-ur],[data-uc]'))node.addEventListener('click',async ev=>{
    ev.stopPropagation();
    try{await deletionController.confirm(node.dataset.ur?'rezultaty':'celi',Number(node.dataset.ur||node.dataset.uc));}
    catch(error){O.tost(error.message);}
  });

  const goalForm=document.querySelector('#novaja .nov-obj');
  const nameInput=goalForm.querySelector('#n-imja'),nameCounter=goalForm.querySelector('#n-name-counter');
  const updateNameCounter=()=>{const length=[...nameInput.value.trim()].length;nameCounter.textContent=length+' / 300';nameCounter.classList.toggle('over',length>300);};
  nameInput.addEventListener('input',updateNameCounter);updateNameCounter();
  O.sozdanieOkrFormy(goalForm,goalForm.dataset.okrCreationKey,async saved=>{cel_slajd=saved.id;otkrytye.add(saved.id);document.getElementById('n-imja').value='';goalForm.dataset.okrCreationKey=crypto.randomUUID();await zagruzit();narisovat();});
  document.getElementById('n-dob').addEventListener('click', async () => {
    if(goalForm.dataset.sending==='1')return;
    if(goalForm.dataset.strategyLoading==='1'){O.tost('Сначала дождись загрузки тезисов стратегии');return;}
    const imja = document.getElementById('n-imja').value.trim();
    if([...imja].length>300){O.tost('Название цели не длиннее 300 знаков');return;}
    if (!imja) { O.tost('Напиши название цели'); return; }
    goalForm.dataset.sending='1';
    try {
                                                                        
                                                                       
      const novaja = await API.sozdat('celi', {
        nazvanie: imja, napravlenie: document.getElementById('n-napr').value,
        period_id: OKR.period,tezis_id:document.getElementById('n-tezis').value?Number(document.getElementById('n-tezis').value):null,zapros_kljuch:goalForm.dataset.okrCreationKey });
      VSE_CELI.push({ ...novaja, rezultaty: [], procent: 0,
                      status_celi: 'po_grafiku', otkrytyh_zadach: 0 });
      otkrytye.add(novaja.id);cel_slajd=novaja.id;
      document.getElementById('n-imja').value = '';
      document.getElementById('n-tezis').value='';
      goalForm.dataset.okrCreationKey=crypto.randomUUID();
      narisovat();
                                                                
                                         
      if (novaja.podskazka) O.tost(novaja.podskazka);
                                                                     
                                                                    
                                                                      
                                                       
      sprositRezultat({ ...novaja, nazvanie: imja }, () => {
        O.tost(`Цель «${imja}» добавлена`, async () => {
          await LocusOkrDelete.removeKnown('celi',novaja);
        });
      });
    } catch (err) { O.tost('Не получилось: ' + err.message); }
    finally{delete goalForm.dataset.sending;}
  });
}

                                                                 

                                                                  
                                                    
function celej_po_napravlenijam() {
  const sch = {};
  for (const n of SPRAV.napravlenija) sch[n.kod] = 0;
  for (const c of VSE_CELI) sch[c.napravlenie] = (sch[c.napravlenie] || 0) + 1;
  return sch;
}

                                                                
                                                                 
                                                          
                             
const MESJACY = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль',
                 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];

function nazvanie_perioda(id) {
  const kv = String(id).match(/^(\d{4})-Q([1-4])$/);
  if (kv) return `${kv[2]} квартал ${kv[1]}`;
  const ms = String(id).match(/^(\d{4})-(\d{2})$/);
  if (ms) return `${MESJACY[Number(ms[2]) - 1]} ${ms[1]}`;
  return `${id} год`;
}

                                                               
function shownWindow(){return selectedGoalId&&view_period?LocusGoalWindow.selected(OKR?.celi?.find(goal=>goal.id===selectedGoalId)):null;}
function shownPeriod(){return shownWindow()?.okno.period||OKR?.period||period_id;}
function writeGoalAddress(){const query=new URLSearchParams();if(den_okr)query.set('den',den_okr);if(VSTROEN)query.set('vstroen','1');if(view_period)query.set('okno',view_period);history.replaceState(null,'','/okr/'+selectedGoalId+(query.size?'?'+query:''));}
async function loadWindow(){
  if(!OKR){location.reload();return;}
  try{await zagruzit();narisovat();obnovitKontekstOkna();}
  catch(error){narisovat();obnovitKontekstOkna();O.tost('Не удалось обновить срез: '+error.message);}
}
let anchorTarget=null,anchorObserver=null,anchorListeners=false,anchorFollow=null,anchorFrame=0;
function scheduleGoalAnchor(){if(!anchorFollow||anchorFrame)return;anchorFrame=requestAnimationFrame(()=>{anchorFrame=0;anchorFollow?.();});}
function pokazatKontekstCeli(node){
 if(!node)return;anchorTarget=node;
 const follow=()=>{if(anchorTarget!==node||!node.isConnected)return;const header=document.getElementById('menju'),gap=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--space-3'))||0,inset=header?Math.max(0,header.getBoundingClientRect().bottom):0,delta=node.getBoundingClientRect().top-inset-gap;if(Math.abs(delta)>0.5)window.scrollBy({top:delta,behavior:'instant'});};
 anchorFollow=follow;
 if(!anchorListeners){
  for(const event of ['wheel','touchstart','pointerdown','keydown'])document.addEventListener(event,()=>{anchorTarget=null;anchorFollow=null;},{passive:true,capture:true});
  for(const event of ['scroll','pageshow','resize'])window.addEventListener(event,scheduleGoalAnchor,{passive:true});anchorListeners=true;
 }
                                                                          
                                                                             
                                                              
 if(selectedGoalId&&'scrollRestoration'in history)history.scrollRestoration='manual';
 anchorObserver?.disconnect();const header=document.getElementById('menju');if(typeof ResizeObserver==='function'){anchorObserver=new ResizeObserver(scheduleGoalAnchor);if(header)anchorObserver.observe(header);if(node.parentElement)anchorObserver.observe(node.parentElement);}
 follow();scheduleGoalAnchor();document.fonts?.ready.then(scheduleGoalAnchor);
}
function obnovitKontekstOkna(){obnovitShapku();const status=document.getElementById('okr-window-state');pokazatKontekstCeli(status&&!status.hidden?status:selectedGoalId?document.querySelector(`.cel[data-id="${selectedGoalId}"]`):document.getElementById('celi'));}
function renderWindowState(){
 const host=document.getElementById('okr-window-state'),view=shownWindow();if(!host)return;host.replaceChildren();host.hidden=!windowReadError&&!view;if(host.hidden)return;
 const text=document.createElement('p');
 if(windowReadError){text.textContent='Не удалось загрузить выбранный срез. '+windowReadError.message+(view?' Показан предыдущий срез.':'');const retry=document.createElement('button');retry.type='button';retry.className='kn';retry.dataset.windowRetry='1';retry.textContent='повторить загрузку';retry.onclick=loadWindow;host.append(text,retry);}
 else{text.textContent='Срез: '+nazvanie_perioda(view.okno.period)+'. Цель и её общий прогресс: '+nazvanie_perioda(period_id)+'.'+(view.okno.pochemu?' '+view.okno.pochemu:!view.rezultaty.every(row=>row.plan_na_okno_zadan||row.skryto?.includes('dengi'))?' План на этот срез отдельно не задан.':'');host.append(text);}
 if(selectedGoalId&&view&&/^\d{4}(?:-Q[1-4])?$/.test(view.okno.period)&&CELI.find(g=>g.id===selectedGoalId)?.prava_celi?.mozhno_pravit&&view.okno.dostupno){const plan=document.createElement('button');plan.type='button';plan.className='kn';plan.dataset.windowPlanOpen='1';plan.textContent=view.okno.period.includes('Q')?'планы по месяцам':'планы по кварталам';plan.onclick=()=>periodPlanner.open(selectedGoalId,view.okno.period);host.append(plan);}
 if(selectedGoalId){const back=document.createElement('button');back.type='button';back.className='kn';back.dataset.windowOriginal='1';back.textContent='к периоду цели';back.onclick=()=>{view_period=null;writeGoalAddress();loadWindow();};host.append(back);}
 if(selectedGoalId){let target;try{target=LocusGoalWindow.parse(view_period||view?.okno.period||period_id).id;}catch{return;}const list=document.createElement('button');list.type='button';list.className='kn';list.dataset.windowList='1';list.textContent='все цели периода';list.setAttribute('aria-label','Все цели: '+nazvanie_perioda(target));list.onclick=()=>{period_id=target;adres();loadWindow();};host.append(list);}
}
function windowResult(goal,row,view){
 const value=view.rezultaty.find(result=>result.id===row.id),usesMovement=!!value?.plan_perioda,display=usesMovement?value?.dvizhenie_perioda:value?.fakt,text=display==null?'нет данных':row.tip==='veha'?(display?'закрыта':'не закрыта'):LocusDecimalPlan.format(display),esc=O.ekranirovat;
 const overall=row.fakt==null?'нет данных':row.tip==='veha'?(row.fakt?'закрыта':'не закрыта'):LocusDecimalPlan.format(row.fakt);
 const original='Цель '+nazvanie_perioda(goal.period_id)+': '+overall+(row.tip==='veha'?'':', план '+(row.plan==null?'не задан':LocusDecimalPlan.format(row.plan)))+(row.progress_pct==null?'':', '+row.progress_pct+'%');
 return `<div class="rez goal-window-result" data-rez="${row.id}" data-cel="${goal.id}"><span class="rez-n">${esc(row.nazvanie)}<small class="goal-window-caption" data-window-caption>${esc(nazvanie_perioda(view.okno.period))}. ${esc(usesMovement?(value?.pochemu_net_dvizhenija||('Движение за период. Значение на '+SPR.data(value.na_datu)+': '+(value.fakt==null?'нет данных':LocusDecimalPlan.format(value.fakt)))):value?.pochemu_net_fakta||('Значение на '+SPR.data(value.na_datu)))}${value?.otkuda?'<br>'+esc(value.otkuda)+(value.kto_imja?' · '+esc(value.kto_imja):''):''}</small><small class="goal-window-caption" data-window-overall>${esc(original)}</small>${(row.istochnik??'ruchnoj_zamer')==='ruchnoj_zamer'&&row.tip!=='veha'?`<span class="measurement-actions"><button type="button" class="kn" data-measure-history="${row.id}">все замеры</button></span>`:''}</span><span class="rez-c" data-window-fact>${esc(text)}</span><span class="rez-c" data-window-plan>${value?.plan==null?'—':esc(LocusDecimalPlan.format(value.plan))}</span><span class="rez-c" data-window-progress>${value?.progress_pct==null?'—':esc(value.progress_pct)+'%'}</span><span></span></div>`;
}

function vid_perioda() {
  const tip = LocusGoalWindow.parse(shownPeriod()).kind;
  return '<span class="vid">' +
    [['квартал', 'kvartal'], ['месяц', 'mesjac'], ['год', 'god']].map(([imja, kod]) =>
      `<a class="vid-e${kod === tip ? ' on' : ''}" data-vid="${kod}">${imja}</a>`).join('') +
    '</span>';
}

                                                   
function obnovitShapku() {
  const b = document.querySelector('.ned-period b');
  if (b) b.textContent = nazvanie_perioda(shownPeriod());
  const nd = document.querySelector('.ned-period .nd');
  if (nd) nd.textContent = SPR.period(shownWindow()?.okno.nachalo||OKR.nachalo, shownWindow()?.okno.konec||OKR.konec);
  document.querySelectorAll('[data-vid]').forEach((e) =>
    e.classList.toggle('on', e.dataset.vid === LocusGoalWindow.parse(shownPeriod()).kind));
}

function vkljuchitVidPerioda() {
  document.querySelectorAll('[data-vid]').forEach((e) =>
    e.addEventListener('click', async () => {
      if (e.classList.contains('on')) return;
      const next=LocusGoalWindow.choose(shownPeriod(),e.dataset.vid,SPR.segodnja());
      if(selectedGoalId){view_period=next;writeGoalAddress();await loadWindow();}
      else{period_id=next;adres();try{await zagruzit();narisovat();obnovitShapku();}catch(error){O.tost('Не получилось: '+error.message);}}
    }));
}

                                                              
                                         
function vkljuchitNapravlenija() {
  document.querySelectorAll('[data-napr]').forEach((e) => {
    e.classList.toggle('on', (e.dataset.napr || '') === fNapr);
    e.addEventListener('click', () => {
      fNapr = e.dataset.napr || '';
      document.querySelectorAll('[data-napr]').forEach((x) =>
        x.classList.toggle('on', (x.dataset.napr || '') === fNapr));
      adres(); narisovat();
    });
  });
}

function adres() {
  selectedGoalId=null;view_period=null;windowReadError=null;const query=new URLSearchParams();query.set('period',period_id);if(fNapr)query.set('napravlenie',fNapr);if(den_okr)query.set('den',den_okr);if(VSTROEN)query.set('vstroen','1');history.replaceState(null,'','/okr.html?'+query);
}

(async function start() {
  try {
    if(selectedGoalId){const goal=await API.zapros('GET','/okr?'+new URLSearchParams({nomer:selectedGoalId,...(den_okr?{den:den_okr}:{})}));if(goal.id!==selectedGoalId||!goal.period_id)throw new Error('Не удалось подтвердить выбранную цель');period_id=goal.period_id;fNapr=goal.napravlenie;const url=new URL(location.href);if(window.LocusTaskRoute.entity(url)?.table==='celi'){for(const key of ['cel','nomer','period','napravlenie'])url.searchParams.delete(key);}else{url.searchParams.set('period',period_id);url.searchParams.set('napravlenie',fNapr);}history.replaceState(null,'',url.pathname+url.search+url.hash);}
    await zagruzit();
                                                            
                                                                 
                                                                  
                                   
      
                                                              
                                                             
                                                                 
                                          
    sobrat_menju();
    vkljuchitNapravlenija();
    vkljuchitVidPerioda();
                                                   
                                                                  
    if (CEL_IZ_ADRESA) {
      otkrytye.add(CEL_IZ_ADRESA);
      narisovat();
    }
                                                              
                                                              
    const perevjazatShapku = () => {
      vkljuchitNapravlenija();
      vkljuchitVidPerioda();
      O.vkljuchitSkvoznoe();
      O.vkljuchitSprint(async (shag) => {
        sdvinut_sprint(shag);
        await zagruzit();
        sobrat_menju();
        perevjazatShapku();
        narisovat();
      });
    };
    O.vkljuchitSprint(async (shag) => {
      sdvinut_sprint(shag);
      await zagruzit();
      sobrat_menju();
      perevjazatShapku();
      narisovat();
    });
    narisovat();

    if(CEL_IZ_ADRESA)pokazatKontekstCeli(view_period?document.getElementById('okr-window-state'):document.querySelector(`.cel[data-id="${CEL_IZ_ADRESA}"]`));

    window.OPROS = async () => { await zagruzit(); narisovat(); };
    O.vkljuchitSkvoznoe();
                                                            
                                                                
                             
    O.vkljuchitPeriod(async (shag) => {
      let next;try{next=LocusGoalWindow.shifted(shownPeriod(),shag);}catch(error){O.tost(error.message);return;}
      if(selectedGoalId){view_period=next;writeGoalAddress();await loadWindow();}
      else{period_id=next;adres();try{await zagruzit();narisovat();obnovitShapku();}catch(error){O.tost('Не получилось: '+error.message);}}
    });
    document.body.dataset.gotovo = String(CELI.length);
  } catch (e) {
    renderWindowState();
    document.getElementById('celi').innerHTML =
      `<div class="pusto"><div class="pusto-z">Не получилось загрузить</div>
       <div class="pusto-p">${e.message}</div></div>`;
    document.body.dataset.oshibka = e.message;
  }
})();
})();
</script>
