<script>
(function () {
let SPRAV = null, P = null, SOSTOJANIJA = null, INSAJTY = [], SOCSETI = [];
                                                           
                                                              
let gruppa_zadach = 'produkt';
let napr = new URLSearchParams(location.search).get('napravlenie') || 'synapt';
let nedelja = new URLSearchParams(location.search).get('nedelja') || null;
let god = new URLSearchParams(location.search).get('god') || null;
const kljuchNedeli = () => {const w=SPR.kalendar.razobrat_nedelju(nedelja,god);return SPR.kalendar.kljuch_nedeli(w.god,w.nomer);};
const sledNedelja = () => SPR.kalendar.sdvinut_nedelju(P.god,P.nedelja,1);
const kljuchSled = () => { const w=sledNedelja(); return SPR.kalendar.kljuch_nedeli(w.god,w.nomer); };

                                                                 
const STATUS_PROEKTA = { idet: 'идёт', zavershen: 'завершён',
                         pauza: 'пауза', otmenen: 'отменён' };
const TIP_ZAPISI = { ideja: 'идея', gipoteza: 'гипотеза',
                     obratnaja_svjaz: 'обратная связь', refleksija: 'рефлексия',
                     princip: 'принцип', novoe: 'новое' };

                                                          
                                                              
function skl(n, odna, dve, pjat) {
  const d = n % 10, s = n % 100;
  if (s >= 11 && s <= 14) return pjat;
  if (d === 1) return odna;
  if (d >= 2 && d <= 4) return dve;
  return pjat;
}

const dengi = (n) => n == null ? '—'
  : n >= 1000000 ? (n / 1000000).toFixed(2).replace('.', ',').replace(',00', '') + ' млн ₽'
  : n >= 1000 ? Math.round(n / 1000) + ' тыс. ₽' : n + ' ₽';

                                                                 
                                                               
                                                         
function stroka_rassylki(r) {
  const v = r.voronka || {};
  const nedelja = v.za_nedelju || {};
  const dolja = (n) => v.v_baze ? Math.round((n / v.v_baze) * 100) : 0;

function dengi_para(n) {
  if (n == null) return ['—', ''];
  if (n >= 1000000) {
    return [(n / 1000000).toFixed(2).replace('.', ',').replace(',00', ''), 'млн ₽'];
  }
  if (n >= 1000) return [String(Math.round(n / 1000)), 'тыс. ₽'];
  return [String(n), '₽'];
}

function weeklyGoalResult(goal,row){
 const esc=O.ekranirovat,known=v=>typeof v==='number'&&Number.isFinite(v),fmt=v=>known(v)?LocusDecimalPlan.format(v):'нет данных',signed=v=>known(v)?(v>0?'+':'')+fmt(v):'нет данных';
 if(row.skryto?.includes('dengi'))return '<div class="week-goal-note">Денежный результат скрыт по правам доступа</div>';
 const views=row.razrezy;if(!views)return `<div class="week-goal-result"><div class="week-goal-title">${esc(row.nazvanie)}</div><div>${esc(fmt(row.fakt))} / ${row.plan==null?'план не задан':esc(fmt(row.plan))}</div><small class="week-goal-meta">Периодные срезы в этом отчёте не сохранены</small></div>`;
 const cells=[['nedelja','За неделю'],['mesjac','Месяц'],['kvartal','Квартал'],['god','Год']].map(([key,label])=>{
  const v=views[key];if(!v)return `<div class="week-goal-cell"><span class="week-goal-label">${label}</span><span class="week-goal-value">нет данных</span></div>`;
  const movement=!!v.plan_perioda,value=movement?v.dvizhenie_perioda:v.fakt,isWeek=key==='nedelja';
  let text=isWeek?signed(v.dvizhenie_perioda):row.tip==='veha'?(v.fakt==null?'нет данных':v.fakt?'закрыта':'не закрыта'):fmt(value)+(v.plan==null?'':' / '+fmt(v.plan));
  let note=isWeek?(v.dvizhenie_perioda==null?v.pochemu_net_dvizhenija||v.pochemu_net_fakta||'Нет подтверждённых данных':'движение за неделю'):(value==null?v.pochemu_net_dvizhenija||v.pochemu_net_fakta||'Нет подтверждённых данных':(v.progress_pct==null?'':v.progress_pct+'% · ')+(movement?'движение':row.tip==='veha'?'состояние':'значение')+(v.plan==null?' · план не задан':''));
  const tag=isWeek?'div':'a',href=isWeek?'':` href="/okr/${goal.id}?${esc(new URLSearchParams({okno:v.period,den:v.na_datu}).toString())}"`;
  return `<${tag} class="week-goal-cell" data-week-scope="${key}"${href}><span class="week-goal-label">${label}</span><span class="week-goal-period">${esc(isWeek?'спринт '+P.nedelja:goalPeriodName(v.period))}</span><span class="week-goal-value">${esc(text)}</span><small class="week-goal-meta">${esc(note)}</small></${tag}>`;
 }).join('');
 const source=row.istochnik_fakta==='baza'?'исходная база · замеров пока нет':row.tip==='veha'?'состояние':row.istochnik==='formula'?'по формуле':row.istochnik==='akkaunt'?'из аккаунта':'ручной замер';
 return `<div class="week-goal-result" data-week-result="${row.id}"><div class="week-goal-title">${esc(row.nazvanie)}<small class="week-goal-source">${source} · ${row.na_datu?'срез на '+esc(SPR.data(row.na_datu)):'дата не подтверждена'}</small></div><div class="week-goal-grid">${cells}</div></div>`;
}

 const celi=P.svodka.celi||[],ustar=P.ustarevshie_zamery||[],invalid=P.svodka.celi_bez_perioda||[];
 return `<div class="blk" id="blk-celi">${zagolovok('цели и результаты',celi.length)}`+(celi.length?celi.map(c=>{

 }).join(''):'<div class="net">В этой неделе нет целей с подходящим периодом</div>')+(P.svodka.celi_skryty?'<p class="week-goal-note">Некоторые цели в этом снимке недоступны по текущим правам. Общий процент скрыт</p>':'')+(invalid.length?'<p class="week-goal-note">Для части целей период не подтверждён: '+invalid.map(c=>O.ekranirovat(c.nazvanie)).join(', ')+'. Их недельный срез не рассчитан</p>':'')+'</div>';
}

                                                      
                                                                   
                                                              
                                                                
                                                  
const GRANI_OS = [['poluchilos', 'получилось', 'Что получилось: '],
  ['zastrjalo', 'застряло', 'Что застряло: '],
  ['obsuzhdaem', 'обсуждаем', 'Обсуждаем: '],
  ['predlagaju', 'предлагаю', 'Предлагаю: ']];
const granOS = (t) => GRANI_OS.find(([, , pr]) => String(t || '').startsWith(pr));

function blokOS() {
  const zapisi = (P.obratnaja_svjaz || []).filter((z) => Number(z.sprint) === Number(P.nedelja) && Number(z.god_sprinta) === Number(P.god)
    && z.tip === 'refleksija');
  const po_granji = os_gran ? zapisi.filter((z) => (granOS(z.tekst) || [])[0] === os_gran) : zapisi;
                                                 
  const ids = [...new Set([...po_granji.map((z) => z.chelovek_id),
    ...(os_gran ? [] : [...TOKENY.keys()])])];
  const ljudi = ids.map((id) => {
    const chel = (SPRAV.ljudi || []).find((l) => l.id === id) || {};
    const z = po_granji.filter((x) => x.chelovek_id === id);
    return { id, chel, imja: (snimokTolkoChitat()?(z[0]?.avtor_imja||TOKENY.get(id)?.imja):null)||chel.imja||(z[0]&&z[0].avtor_imja)||'кто-то',
             zapisi: z, tokeny: TOKENY.get(id)?.resurs ?? null };
  }).filter((x) => x.zapisi.length || x.tokeny != null)
    .sort((a, b) => b.zapisi.length - a.zapisi.length);
  const NA_STR = 2;
  const stranic = Math.max(1, Math.ceil(ljudi.length / NA_STR));
  if (os_str >= stranic) os_str = stranic - 1;
  const vidno = ljudi.slice(os_str * NA_STR, os_str * NA_STR + NA_STR);
  const skolko = (kod) => zapisi.filter((z) => (granOS(z.tekst) || [])[0] === kod).length;

  const kartochka = (x) => `<div class="os-k">
    <div class="os-k-sh">${x.chel.foto ? O.avatar(x.chel, 26) : ''}
      <b>${O.ekranirovat(x.imja)}</b><i></i>
      ${x.tokeny != null ? `<span class="os-tok" title="токены за спринт">токены ${x.tokeny}%</span>` : ''}</div>
    ${x.zapisi.length ? x.zapisi.map((z) => {
      const g = granOS(z.tekst);
      const t = g ? String(z.tekst).slice(g[2].length) : z.tekst;
      return `<div class="os-z">${g ? `<span class="os-g">${g[1]}</span>` : ''}
        <span>${O.ekranirovat(String(t).charAt(0).toUpperCase() + String(t).slice(1))}</span></div>`;
    }).join('') : '<div class="os-z os-net">рефлексию пока не писал</div>'}
  </div>`;

  return `<div class="blk" id="blk-os">${zagolovok('обратная связь', zapisi.length)}
    <div class="pl-segi">${segmenty('osg', [['', 'все', zapisi.length],
      ...GRANI_OS.map(([k, im]) => [k, im, skolko(k)]).filter(([, , n]) => n)], os_gran || '')}</div>
    ${ljudi.length ? `<div class="os-karty">${vidno.map(kartochka).join('')}</div>
      ${stranic > 1 ? `<div class="os-pag">
        <a class="os-str" data-os-str="-1" aria-label="назад"${os_str === 0 ? ' data-vykl="1"' : ''}>
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none"><path d="M10 3.5 5.5 8l4.5 4.5"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <span class="os-tochki">${Array.from({ length: stranic }, (_, i) =>
          `<a class="os-t${i === os_str ? ' on' : ''}" data-os-t="${i}" aria-label="страница ${i + 1}"></a>`).join('')}</span>
        <a class="os-str" data-os-str="1" aria-label="вперёд"${os_str >= stranic - 1 ? ' data-vykl="1"' : ''}>
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none"><path d="M6 3.5 10.5 8 6 12.5"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>` : ''}`
      : '<div class="net">за этот спринт рефлексией пока не делились</div>'}
  </div>`;
}

function bloki() {
                                                             
                                                           
                                                            
                                                             
  const bz = P.biznes || {};
  const rs = bz.rassylki || [];
  const L = [], R = [];
  L.push(blokCelej());
  L.push(`<div class="blk" id="blk-lidy">${zagolovok('лиды спринта',null)}
    <div class="pol">
      <div class="pol-s"><span class="pol-n">новые</span><span class="pol-z" data-leads-new>${P.lidy?.novyh??0}</span></div>
      <div class="pol-s"><span class="pol-n">прежние, с кем работали</span><span class="pol-z" data-leads-previous>${P.lidy?.prezhnih??0}</span></div>
    </div>${P.lidy?.polnota_dannyh&&!P.lidy.polnota_dannyh.polnaja?`<div class="net">Учтены подтверждённые переходы. Без полной истории: ${P.lidy.polnota_dannyh.bez_istorii}</div>`:''}
  </div>`);
  L.push(`<div class="blk">${zagolovok('рассылка спринта', rs.length)}` +
    (rs.length ? rs.map((r) => stroka_rassylki(r)).join('')
      : '<div class="net">рассылок на этот спринт нет</div>') + '</div>');
  L.push(blokDeneg());
  if (INSAJTY.length) L.push('<section class="blk" id="blk-insajty"><div data-insights-host></div></section>');
  R.push(blokZadach());
  R.push(blokKlientov());
  if (SOCSETI && SOCSETI.length) {
    R.push(`<div class="blk">${zagolovok('соцсети за неделю', SOCSETI.length)}` +
      SOCSETI.map((a) => `<div class="dno"><span class="im">${a.nazvanie}</span>
        <span class="ks">${a.ploshadka || ''}</span>
        <span class="dn">${a.podpischikov != null ? a.podpischikov : '—'}${
          a.delta ? ` <i class="soc-d">${a.delta > 0 ? '+' : ''}${a.delta}</i>` : ''}</span>
      </div>`).join('') + '</div>');
  }
  R.push(blokOS());
  document.getElementById('levo').innerHTML = L.join('');
  document.getElementById('pravo').innerHTML = R.join('');
}

                                                                    
function kBloku(id, migat = true) {
  const b = document.getElementById(id);
  if (!b) return;
  b.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (!migat) return;
  b.classList.remove('migaet');
  void b.offsetWidth;
  b.classList.add('migaet');
  setTimeout(() => b.classList.remove('migaet'), 1900);
}

async function pokazatSled() {
  if (SLED_ZADACHI !== null) return;
  try {
    const o = await API.spisok('zadachi', { napravlenie: napr, sprint: kljuchSled(), na_stranice: 300 });
    SLED_ZADACHI = (o.spisok || []).filter((z) => !z.udaleno);
  } catch { SLED_ZADACHI = []; }
}

const STADII_K = { v_rabote: 'в работе', zhdem_oplatu: 'ждём оплату',
  ne_pisali: 'не писали', napisali: 'написали', otkliknulsja: 'откликнулся',
  peregovory: 'переговоры', pauza: 'пауза' };

function narisovat() {
  plitki(); bloki(); O.ponumerovat();
  LocusInsights.mount({host:document.querySelector('[data-insights-host]'),rows:INSAJTY,editable:P.istochnik_otcheta?.vid==='tekuschaja',scope:[API.ja,napr,P.god,P.nedelja,P.istochnik_otcheta?.vid].join(':')});
  weeklyCommands.mount(document.getElementById('weekly-report-actions'),P);
  document.getElementById('weekly-report-state').textContent=podpisOtcheta(P)+(snimokTolkoChitat()&&!P.dopolnenija?' · дополнительные сведения об оплатах, ресурсах и соцсетях в этом снимке не сохранены':'');
  for(const selected of document.querySelectorAll('.pl-seg .vid-e.on')){
    const rail=selected.closest('.pl-seg'),bounds=rail.getBoundingClientRect(),item=selected.getBoundingClientRect();
    if(item.left<bounds.left)rail.scrollLeft-=bounds.left-item.left;
    else if(item.right>bounds.right)rail.scrollLeft+=item.right-bounds.right;
  }
  const pere = () => narisovat();
                                
  document.querySelectorAll('[data-pl-kuda]').forEach((e) =>
    e.addEventListener('click', (ev) => {
      ev.preventDefault();
      const k = e.dataset.plKuda;
      if (k === 'dengi') return kBloku('blk-dengi');
      if (k === 'celi') return kBloku('blk-celi');
                                                                     
      zad_sprint = 'tek'; zad_tip = 'vse'; zad_status = k;
      pere();
      kBloku('blk-zadachi');
    }));
  const seg = (atr, f) => document.querySelectorAll(`[data-${atr}]`).forEach((e) =>
    e.addEventListener('click', async () => { await f(e.dataset[atr.replace(/-./g, (m) => m[1].toUpperCase())]); pere(); }));
  seg('zsp', async (v) => { zad_sprint = v; zad_status = 'vse'; if (v === 'sled') await pokazatSled(); });
  seg('ztip', (v) => { zad_tip = v; });
  seg('zst', (v) => { zad_status = v; });
  seg('kls', (v) => { kl_seg = v; });
  seg('osg', (v) => { os_gran = v || null; os_str = 0; });
  document.querySelector('[data-pl-prochee]')?.addEventListener('click', () => {
    prochee_otkryto = !prochee_otkryto; pere();
  });
                                              
  document.querySelectorAll('[data-os-str]').forEach((e) =>
    e.addEventListener('click', () => {
      if (e.dataset.vykl) return;
      os_str += Number(e.dataset.osStr); pere();
    }));
  document.querySelectorAll('[data-os-t]').forEach((e) =>
    e.addEventListener('click', () => { os_str = Number(e.dataset.osT); pere(); }));
  if(snimokTolkoChitat()){
   document.querySelectorAll('[data-pl-zad],[data-opl],[data-zam-ok],.pl-zam,[data-zsp="sled"]').forEach(n=>n.hidden=true);
   document.querySelectorAll('#levo .gal-b,#pravo .gal-b').forEach(n=>{n.setAttribute('aria-disabled','true');n.setAttribute('title','Состояние задачи в сохранённом снимке');n.tabIndex=-1;n.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();});});
   return;
  }
                                                                     
  document.querySelectorAll('[data-pl-zad]').forEach((e) =>
    e.addEventListener('click', () => O.formaZadachiModalka({
      klient_id: Number(e.dataset.plZad), napravlenie: napr, tip: e.dataset.tip,
    })));
                                                             
  document.querySelectorAll('[data-opl]').forEach((e) =>
    e.addEventListener('click', () => O.otmetitOplatu(Number(e.dataset.opl), {
      proekt_id: Number(e.dataset.proekt),
      posle: async () => { if(await zagruzit())narisovat(); },
    })));
                                                                 
  document.querySelectorAll('[data-zam-ok]').forEach((e) =>
    e.addEventListener('click', async () => {
      const rez = Number(e.dataset.zamOk);
      const pole = document.querySelector(`[data-zam-rez="${rez}"]`);
      const v = pole?.value.trim().replace(',', '.');
      if (!pole || !v || !Number.isFinite(Number(v))) {
        O.tost('Впиши число'); pole?.focus(); return;
      }
      const original=(P.svodka.celi||[]).flatMap(c=>c.rezultaty||[]).find(r=>r.id===rez);
      O.zamer({rez:{id:rez,nazvanie:original?.nazvanie||'результат планёрки'},znachenie:v,onChanged:async()=>{if(await zagruzit())narisovat();}});
    }));
                                              
  document.querySelectorAll('#levo .gal-b, #pravo .gal-b').forEach((g) =>
    g.addEventListener('click', async (ev) => {
      ev.stopPropagation(); ev.preventDefault();
      const uzel = g.closest('[data-nomer]');
      const nomer = Number(uzel?.dataset.nomer);
      if (!nomer) return;
      await O.zakrytZadachu(nomer, uzel,
        async () => { if(await zagruzit())narisovat(); });
    }));
  O.vkljuchitStatusy((stroka, status) => O.smenitStatusZadachi(stroka, status,
    async () => { if(await zagruzit())narisovat(); }));
}

            const r = (a ?? 0) - (b ?? 0);
            const klass = partialA||partialB||!r || luchshe_bolshe == null ? '' : ((r > 0) === luchshe_bolshe ? ' plus' : ' minus');
            const fr = partialA||partialB?'—':!r ? '0' : (r > 0 ? '+' : '−') + (dengi_li ? dengi_para(Math.abs(r)).join(' ') : Math.abs(r));
            return `<div class="sr-s"><span class="sr-im">${imja}</span>
              <b>${fa}</b><b class="sr-b">${fb}</b><span class="sr-r${klass}">${fr}</span></div>`;
          }).join('');
      } catch (er) { if(sequence===srRequest&&okno?.isConnected)telo.innerHTML = `<div class="net">Не получилось прочитать неделю: ${O.ekranirovat(er.message)}</div>`; }
    };
    okno?.querySelectorAll('[data-sr]').forEach((e) => e.addEventListener('click', () => {
      const n = SPR.kalendar.sdvinut_nedelju(vtoroj.god,vtoroj.nomer,Number(e.dataset.sr));
      if (n.nomer === P.nedelja && n.god === P.god) return;
      vtoroj = n; schitat();
    }));
    schitat();
  });
}

function tekstFolloaupa() {
  const im = (P.napravlenie_nazvanie || napr).split(/[,(]/)[0].trim();
  const stroki = [`#фоллоуап ${im}, спринт ${P.nedelja}`, ''];
  const celi = (P.svodka.celi || []).slice(0, 5);
  if (celi.length) {
    stroki.push('цели:');
    celi.forEach((c) => stroki.push(`– ${c.nazvanie}: ${c.skryto?.includes('dengi') ? 'денежный блок скрыт' : c.procent==null?'нет замера':c.procent + '%'}`));
    stroki.push('');
  }
  stroki.push(`задачи: закрыто ${P.svodka.zakryto}, открыто ${
    P.svodka.otkryto}, просрочено ${P.svodka.prosrocheno}`);
  if (P.lidy) {stroki.push(`лиды: новых ${P.lidy.novyh}, прежних ${P.lidy.prezhnih}`);if(P.lidy.polnota_dannyh&&!P.lidy.polnota_dannyh.polnaja)stroki.push(`учтены подтверждённые переходы, без полной истории: ${P.lidy.polnota_dannyh.bez_istorii}`);}
  if (P.dengi && !P.dengi.skryto) {
    stroki.push(`деньги: пришло за неделю ${dengi_para(P.dengi.prishlo_za_nedelju).join(' ')
      }, не оплачено ${dengi_para(P.dengi.vystavleno_ne_oplacheno).join(' ')}`);
  }
  if (P.svodka.publikacij) stroki.push(`контент: публикаций ${P.svodka.publikacij}`);
  const klienty = (P.klienty || []).slice(0, 6);
  if (klienty.length) {
    stroki.push('', 'клиенты:');
    klienty.forEach((k) => stroki.push(`– ${k.imja || k.klient_imja || ''}${
      k.chto_sdelali ? ': ' + k.chto_sdelali : ''}`));
  }
  return stroki.join('\n');
}

(async function start() {
  try {
    SPRAV = await SPR.zagruzit();
    window.DANNYE = { napravlenija: SPRAV.napravlenija, ljudi: SPRAV.ljudi,
                      statusy: SPRAV.statusy, tipy: SPRAV.tipy, zadachi: [] };
    await zagruzit();
    document.getElementById('menju').innerHTML = O.menju('Планёрка', {
                                                                 
                                                                 
                                                 
      napravlenija: true, chisla: P.po_napravlenijam, bez_vseh: true,
      period: [`спринт ${P.nedelja} / ${P.god}`, SPR.period(P.nachalo, P.konec)],
    });
                                                                        
    document.querySelectorAll('[data-napr]').forEach((e) => {
      e.classList.toggle('on', e.dataset.napr === napr);
      e.addEventListener('click', () => smenit_napravlenie(e.dataset.napr));
    });
    window.OPROS = async () => {try{if(await zagruzit()){narisovat();privjazatDejstvijaNedeli();}}catch(error){if([401,403].includes(error.kod)){zakrytSravnenie();weeklyCommands.invalidate();document.getElementById('weekly-report-actions').replaceChildren();document.getElementById('levo').replaceChildren();document.getElementById('pravo').replaceChildren();document.getElementById('plitki').replaceChildren();}document.getElementById('weekly-report-state').textContent=(P?podpisOtcheta(P)+' · ':'')+'Не удалось обновить чтение. Повтори загрузку';throw error;}};
    narisovat();
    privjazatDejstvijaNedeli();
    O.vkljuchitSkvoznoe();
                                                                 
    O.vkljuchitPeriod(async (shag) => {
      const next=SPR.kalendar.sdvinut_nedelju(P.god,P.nedelja,shag);
      nedelja=next.nomer; god=next.god;
      history.replaceState(null, '', `?napravlenie=${napr}&nedelja=${kljuchNedeli()}`);
      try {
        if(!await zagruzit())return; narisovat();
        document.querySelector('.ned b').textContent = `спринт ${P.nedelja} / ${P.god}`;
        document.querySelector('.ned .nd').textContent =
          SPR.period(P.nachalo, P.konec);
      } catch (e) { O.tost('Не получилось: ' + e.message); }
    });
    document.body.dataset.gotovo = String(P.svodka.vsego_zadach);
  } catch (e) {
    document.getElementById('levo').innerHTML =
      `<div class="pusto"><div class="pusto-z">Не получилось загрузить</div>
       <div class="pusto-p">${O.ekranirovat(e.message)}</div></div>`;
    document.body.dataset.oshibka = e.message;
  }
})();
})();
