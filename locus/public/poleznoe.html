const TIPY_NAHODKI = window.LocusFeedText.kinds;

                                                             
                                                   
function tipNahodki(tekst) {
  const t = String(tekst || '').trimStart().toLowerCase();
  for (const [kod, , pristavka] of TIPY_NAHODKI) {
    if (t.startsWith(pristavka.trim().toLowerCase())) return kod;
  }
  if (t.startsWith('вывод:')) return 'mysl';
  return 'bez_tipa';
}
function imjaTipa(kod) {
  if (kod === 'bez_tipa') return 'без типа';
  return (TIPY_NAHODKI.find(([k]) => k === kod) || [, kod])[1];
}
                                                            
                                                     
function tekstBezPristavki(tekst) {
  const t = String(tekst || '').trimStart();
                                                      
  if (t.toLowerCase().startsWith('вывод:')) {
    return t.slice('вывод:'.length).replace(/^[:\s]+/, '');
  }
  for (const [, , pristavka] of TIPY_NAHODKI) {
    if (t.toLowerCase().startsWith(pristavka.trim().toLowerCase())) {
      return t.slice(pristavka.trim().length).replace(/^[:\s]+/, '');
    }
  }
  return t;
}

function vkljuchitKrutilku(uzel, pri_smene) {
  if (!uzel || uzel.dataset.gotova === '1') return;
  uzel.dataset.gotova = '1';
  const chislo = uzel.querySelector('.en-ch');
  const zal = uzel.querySelector('.en-zal');
  const DLINA = Math.PI * 52;
  let v = Number(uzel.dataset.v) || 0;
  let otpravka = null;

  const narisovat_en = () => {
    uzel.dataset.v = String(v);
    uzel.setAttribute('aria-valuenow', String(v));
    if (chislo) chislo.innerHTML = `${v}<i class="slovo">%</i>`;
    if (zal) {
      zal.style.strokeDasharray = `${DLINA}`;
      zal.style.strokeDashoffset = `${DLINA * (1 - v / 100)}`;
    }
  };

  const pomenjat = (na) => {
    const novoe = Math.max(0, Math.min(100, Math.round(na)));
    if (novoe === v) return;
    v = novoe;
    narisovat_en();
                                                           
    clearTimeout(otpravka);
    otpravka = setTimeout(() => pri_smene(v), 650);
  };

  narisovat_en();

  uzel.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    pomenjat(v + (ev.deltaY < 0 ? (ev.shiftKey ? 1 : 5) : (ev.shiftKey ? -1 : -5)));
  }, { passive: false });

  let tjanem = false, ot_y = 0, ot_x = 0, ot_v = 0;
  uzel.addEventListener('pointerdown', (ev) => {
    try { uzel.setPointerCapture(ev.pointerId); } catch {}
    tjanem = true; ot_y = ev.clientY; ot_x = ev.clientX; ot_v = v;
  });
  uzel.addEventListener('pointermove', (ev) => {
    if (!tjanem) return;
    ev.preventDefault();
                                                                
                                            
    const po_y = (ot_y - ev.clientY) / 160 * 100;
    const po_x = (ev.clientX - ot_x) / 160 * 100;
    pomenjat(ot_v + (Math.abs(po_y) > Math.abs(po_x) ? po_y : po_x));
  });
  const konec = () => { tjanem = false; };
  uzel.addEventListener('pointerup', konec);
  uzel.addEventListener('pointercancel', konec);

  uzel.addEventListener('keydown', (ev) => {
    const shag = ev.shiftKey ? 10 : 1;
    if (ev.key === 'ArrowUp' || ev.key === 'ArrowRight') {
      ev.preventDefault(); pomenjat(v + shag);
    } else if (ev.key === 'ArrowDown' || ev.key === 'ArrowLeft') {
      ev.preventDefault(); pomenjat(v - shag);
    } else if (ev.key === 'Home') { ev.preventDefault(); pomenjat(0); }
    else if (ev.key === 'End') { ev.preventDefault(); pomenjat(100); }
  });
}

function gruppaLjudej(zapisi) {
  const po_ljudjam = new Map();
  for (const z of zapisi) {
    po_ljudjam.set(z.chelovek_id, (po_ljudjam.get(z.chelovek_id) || 0) + 1);
  }
  const znachenija = [...po_ljudjam.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([id, n]) => {
      const chel = (SPRAV.ljudi || []).find((l) => l.id === id);
      return [String(id), chel ? chel.imja : 'команда', n,
              chel ? O.avatar(chel, 16) : ''];
    });
  return { kljuch: 'chelovek', podpis: 'человек', znachenija };
}

                                                                  
function gruppaTipov(zapisi) {
  const po_tipam = new Map();
  for (const z of zapisi) {
    const t = tipNahodki(z.tekst);
    po_tipam.set(t, (po_tipam.get(t) || 0) + 1);
  }
  const znachenija = [...po_tipam.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([kod, n]) => [kod, imjaTipa(kod), n]);
  return { kljuch: 'tip', podpis: 'тип', znachenija };
}

                                                                    
                                                                
function otobrat(razdel, zapisi) {
  const f = FILTRY[razdel];
  let sp = zapisi;
  if (f.chelovek) sp = sp.filter((z) => String(z.chelovek_id) === String(f.chelovek));
  if (f.tip) sp = sp.filter((z) => tipNahodki(z.tekst) === f.tip);
  if (f.sprint) { const w=rfNedelja(f.sprint); sp=sp.filter(z=>Number(z.sprint)===w.nomer && Number(z.god_sprinta)===w.god); }
                                                                
                                                                   
                                                                         
  if (f.porjadok === 'starye') sp = sp.slice().reverse();
  return sp;
}

async function zagruzitNapominanija() {

    API.ekran('zadachi', { otvetstvennyj: JA, na_stranice: 100 })
      .catch(() => ({ spisok: [] })),
    API.ekran('plashki', { chelovek_id: JA }).catch(() => ({ plashki: [] })),
    API.zapros('GET', '/uvedomlenija?chelovek_id=' + JA)
      .catch(() => ({ spisok: [] })),
  ]);

                                                             
  const otkryta = (z) => z.status !== 'sdelano' && z.status !== 'kogda_nibud';
  const moi = (zad.spisok || []).filter(otkryta);

  NAPOM = {
                                                                  
    srochno: moi.filter((z) => z.srok && z.srok < segodnja),

function kogda(iso) {
  if (!iso) return '';
  const date=SPR.vremja(iso);
  if(!date||Number.isNaN(date.getTime()))return '';
  const minut = Math.max(0,Math.floor((Date.now() - date.getTime()) / 60000));
  if (minut < 2) return 'только что';
  if (minut < 60) return minut + ' мин назад';
  const chasov = Math.floor(minut / 60);
  if (chasov < 24) return chasov + ' ' + sklChas(chasov) + ' назад';
  const dnej = Math.floor(chasov / 24);
  if (dnej === 1) return 'вчера';
  if (dnej < 7) return dnej + ' ' + sklDen(dnej) + ' назад';
  return SPR.data(iso);
}
function sklChas(n) {
  const o = n % 10, s = n % 100;
  if (o === 1 && s !== 11) return 'час';
  if (o >= 2 && o <= 4 && (s < 12 || s > 14)) return 'часа';
  return 'часов';
}
function sklDen(n) {
  const o = n % 10, s = n % 100;
  if (o === 1 && s !== 11) return 'день';
  if (o >= 2 && o <= 4 && (s < 12 || s > 14)) return 'дня';
  return 'дней';
}

async function readFeed(reset=true){
  const config=feedConfig();if(!config)return;
  if(!reset&&feedViewState?.key===config.key&&feedViewState.loading)return;
  const ticket=++feedReadTicket;
  if(reset||feedViewState?.key!==config.key)feedViewState={key:config.key,rows:[],next:null,total:0,loading:true,error:null};
  else{feedViewState.loading=true;feedViewState.error=null;}
  const cursor=reset?null:feedViewState.next;
  try{
    const data=await API.ekran('lenta/potok',{...config.query,...(cursor?{cursor}:{})});
    if(!data||!Array.isArray(data.spisok)||!Number.isSafeInteger(data.vsego)||data.vsego<0||typeof data.esche!=='boolean'||(data.esche?(typeof data.sledujuschaja!=='string'||!data.sledujuschaja):data.sledujuschaja!==null)||!data.spisok.every(row=>Number.isSafeInteger(row?.id)&&row.id>0&&Number.isSafeInteger(row.versija)&&row.versija>0))throw new Error('Получен неполный список записей');
    if(ticket!==feedReadTicket||feedConfig()?.key!==config.key)return;
    feedViewState.rows=reset?data.spisok:[...new Map([...feedViewState.rows,...data.spisok].map(row=>[row.id,row])).values()];
    feedViewState.next=data.sledujuschaja;feedViewState.total=data.vsego;feedViewState.loading=false;feedViewState.error=null;feedRedraw();
  }catch(error){if(ticket!==feedReadTicket||feedConfig()?.key!==config.key)return;feedViewState.loading=false;feedViewState.error=error.message;feedRedraw();}
}

function razrezatPrincip(tekst) {
  const t = String(tekst || '').trim();
  const dv = t.indexOf(': ');
  if (dv > 8 && dv < 90) {
    return [t.slice(0, dv), t.slice(dv + 2)];
  }
  const tch = t.search(/[.!?] /);
  if (tch > 12 && tch < 90) {
    return [t.slice(0, tch), t.slice(tch + 2)];
  }
  return [t, ''];
}

function privjazatPrincipy() {
  if (vkladka !== 'principy') return;
  const sekcii = [...document.querySelectorAll('.pr-razdel')];
  if (!sekcii.length) return;
  const chipy = [...document.querySelectorAll('[data-pr-razdel]')];
  const nabl = new IntersectionObserver((zapisi) => {
    for (const z of zapisi) {
      if (!z.isIntersecting) continue;
      const sek = z.target.closest('.pr-razdel');
      const i = sekcii.indexOf(sek);
      if (i >= 0 && i + 1 < sekcii.length) {
        sekcii[i + 1].classList.remove('skryt');
      }
      chipy.forEach((c, j) => c.classList.toggle('on', j === i));
    }
  }, { rootMargin: '0px 0px -120px 0px' });
  sekcii.forEach((s) => {
    const posledn = s.querySelector('.pr-punkt:last-of-type');
    if (posledn) nabl.observe(posledn);
  });
}

function zhSlovo(v, pole) {
  if (v === null || v === undefined || v === '') return '—';
  const t = String(v);
                                                              
                                                                  
                                                                  
  const vid = ZH_POLJA_SSYLKI[pole];
  if (vid && /^\d+$/.test(t) && ZH_IMENA && ZH_IMENA[vid]) {
    const imja = ZH_IMENA[vid].get(Number(t));
    if (imja) return imja;
  }
  if (ZH_ZNACHENIJA[t]) return ZH_ZNACHENIJA[t];
                                                                 
                               
  if (t.length > 120 || t.trimStart().startsWith('{')) {
                                                                 
    return `снимок, ${t.length} ${O.skolko(t.length,
      'знак', 'знака', 'знаков')}`;
  }
                                                            
                                                                          
                                                              
  return t.replace(/[a-z_]{3,}/g, (m) => ZH_ZNACHENIJA[m] || m);
}

async function zagruzitImenaZhurnala() {
  if (ZH_IMENA) return ZH_IMENA;
  const pusto = { chelovek: new Map(), zadacha: new Map(),
                  proekt: new Map(), cel: new Map(), shablon: new Map() };
  try {
                                                                   
                                                                  
                                                                   
                                                                 
                                                                
                                                                 
                    
                                                               
                                                                 
                                                                
                                                  
    const [ljudi, zadachi, udalennye, proekty, celi, shablony]
      = await Promise.all([
        API.spisok('ljudi', { na_stranice: 300, arhiv: 1 }),
        API.spisok('zadachi', { na_stranice: 300 }),
        API.spisok('zadachi', { na_stranice: 300, arhivnye: 1 }),
        API.spisok('proekty', { na_stranice: 300, arhiv: 1 }),
        API.spisok('celi', { na_stranice: 300 }),
        API.spisok('shablony', { na_stranice: 300 }),
      ]);
    for (const l of (ljudi.spisok || [])) pusto.chelovek.set(l.id, l.imja);
    for (const z of (zadachi.spisok || [])) pusto.zadacha.set(z.id, z.nazvanie);
                                                                
                                                
    for (const z of (udalennye.spisok || [])) {
      if (!pusto.zadacha.has(z.id)) pusto.zadacha.set(z.id, z.nazvanie);
    }
    for (const p of (proekty.spisok || [])) pusto.proekt.set(p.id, p.nazvanie);
    for (const c of (celi.spisok || [])) {
      pusto.cel.set(c.id, c.nazvanie || c.formulirovka);
    }
    for (const s of (shablony.spisok || [])) pusto.shablon.set(s.id, s.nazvanie);
  } catch (e) {
                                                                      
                                                                
    document.body.dataset.zhurnal_imena_oshibka = e.message;
  }
  ZH_IMENA = pusto;
  return ZH_IMENA;
}

    if (g) {
      const chel = (SPRAV.ljudi || []).find((l) => l.id === g.chelovek_id);
      const den = DNI[(Number(g.den) || 1) - 1];
      return `<span class="pz-zh-im">${O.ekranirovat(chel ? chel.imja : 'команда')}</span>`
        + ` <span class="pz-zh-n">график${den ? ', ' + den : ''}</span>`;
    }
  }
  const imja = ZH_IMENA && ZH_IMENA[z.obekt]
    ? ZH_IMENA[z.obekt].get(Number(z.obekt_id)) : null;
  if (imja) {
    return `<span class="pz-zh-im">${imja}</span>` + (z.obekt_id
      ? ` <span class="pz-zh-n">${vid} № ${z.obekt_id}</span>` : '');

  return vid + (z.obekt_id ? ' № ' + z.obekt_id : '');
}

                                                                 
                                                              
                                       
const ZH_ZHENSKIJ = new Set(['zadacha', 'cel', 'anketa', 'publikacija',
  'rassylka', 'usluga', 'zapis', 'period']);
const ZH_SREDNIJ = new Set(['sotrudnichestvo', 'napravlenie']);
const ZH_ROD = { m: '', z: 'а', s: 'о' };

function rodObekta(o) {
  if (ZH_ZHENSKIJ.has(o)) return 'z';
  if (ZH_SREDNIJ.has(o)) return 's';
  return 'm';
}

                                                                     
function zhStroka(z) {
  const pole = ZH_POLJA[z.pole] || z.pole || 'изменение';
  const obekt = ZH_OBEKTY[z.obekt] || z.obekt;
                                                             
                                                            
  let chto;
  if (z.pole === 'sozdano') {
    chto = 'создан' + ZH_ROD[z.obekt === 'zadacha' ? 'z' : rodObekta(z.obekt)];

    const r = rodObekta(z.obekt);
    chto = r === 'm' ? 'удалён' : 'удален' + ZH_ROD[r];

    chto = `${pole}: ${zhSlovo(z.stalo, z.pole)}`;

  return `<div class="zh-s">

function tumanNadVvodom() {
  const est = document.querySelector('.vvod-k, .rf-vvod');
  let t = document.querySelector('.vvod-tuman');
  if (!est) { t?.remove(); return; }
  if (!t) {
    t = document.createElement('div');
    t.className = 'vvod-tuman';
    document.body.appendChild(t);
  }
  zamerit_tuman();
}

                                                                 
                                                                
                                                                 
                           
function zamerit_tuman() {
  const pole = document.querySelector('.vvod-k, .rf-vvod');
  if (!pole) return;
  const b = pole.getBoundingClientRect();
                                                            
                                                       
                                                                  
                                                              
  const niz = Math.round(window.innerHeight - b.top);
  document.documentElement.style.setProperty('--tuman-niz', `${niz}px`);
                                                                  
                                              
  const skolko = Math.min(190, Math.max(90, Math.round(b.top * 0.42)));
  document.documentElement.style.setProperty('--tuman-vysota', `${skolko}px`);
}
                                                              
                                      
addEventListener('resize', zamerit_tuman);
                                                                  
                                                                
if (typeof ResizeObserver === 'function') {
  const sledit = new ResizeObserver(() => zamerit_tuman());
  const vkljuchit_slezhku = () => {
    const pole = document.querySelector('.vvod-k, .rf-vvod');
    if (pole && !pole.dataset.sledim) {
      pole.dataset.sledim = '1';
      sledit.observe(pole);
      zamerit_tuman();
    }
  };
  new MutationObserver(vkljuchit_slezhku)
    .observe(document.body, { childList: true, subtree: true });
  vkljuchit_slezhku();
}

function prijavlenie() {
  if (nabljudatel) { nabljudatel.disconnect(); nabljudatel = null; }
  const celi = document.querySelectorAll('#telo [data-pr], #telo [data-km]');
  if (!celi.length) return;
                                                              
                                   
  if (!('IntersectionObserver' in window)) {
    celi.forEach((e) => e.classList.add('vidno'));
    return;
  }
  nabljudatel = new IntersectionObserver((zapisi) => {
    for (const z of zapisi) {
      if (z.isIntersecting) {
        z.target.classList.add('vidno');
        nabljudatel.unobserve(z.target);                          
      }
    }
  }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });
  celi.forEach((e) => nabljudatel.observe(e));
}

function privjazatKomandu() {
  const stroki = [...document.querySelectorAll('.km-s')];
  if (!stroki.length) return;

                                                                  
    
                                                                   
                                                              
                                                             
                                                                  
                                   
  const nabljudatel = new IntersectionObserver((zapisi) => {
    const vidimye = zapisi.filter((z) => z.isIntersecting)
      .map((z) => z.target)
      .sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
    if (!vidimye.length) return;
    stroki.forEach((s) => s.classList.toggle('tek', s === vidimye[0]));
  }, { rootMargin: '-28% 0px -56% 0px', threshold: 0 });
  stroki.forEach((s) => nabljudatel.observe(s));

                                                             
              
  document.querySelectorAll('.km-s .km-r').forEach((r) =>
    r.addEventListener('click', () => {
      stroki.forEach((s) => s.classList.toggle('tek', s === r.parentElement));
      r.parentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }));

                                                            
                                                                    
  document.querySelectorAll('[data-lajk]').forEach((l) =>
    l.addEventListener('click', (e) => {
      e.stopPropagation();
      const schet = l.querySelector('.km-schet');
      schet.textContent = String(Number(schet.textContent || 0) + 1);
                                                                   
      l.classList.remove('bum');
      void l.offsetWidth;
      l.classList.add('bum');
    }));
}

let onb_shag = null;
                                                                    
let onb_snjat = null;

async function pokazatOnbording() {
  onb_shag = 0;
                                                                
                                  
  idtiNaShag(0);
}

                                                                     
                                                                
                                                              
function idtiNaShag(i) {
                                                                
                                                                  
                                             
  if (onb_snjat) { onb_snjat(); onb_snjat = null; }
  const shag = ONB_SHAGI[i];
  if (!shag) { zakrytOnbording(true); return; }
  onb_shag = i;
  if (vkladka !== shag.vkladka) {
    vkladka = shag.vkladka;
    nv_stranica = null;
    history.replaceState(null, '', '?vkladka=' + vkladka);
    document.querySelectorAll('[data-vtoroj]').forEach((e) =>
      e.classList.toggle('on', e.dataset.vtoroj === vkladka));
    narisovat();
  }
                                                              
                                                                  
                              
  requestAnimationFrame(() => risovatOnbording(i));
}

function snjatOreol() {
  document.querySelectorAll('.pz-onb-cel').forEach((e) =>
    e.classList.remove('pz-onb-cel'));
}

                                                              
                                                           
                         
const onb_sdelano = new Set();

function risovatOnbording(i) {
  const shag = ONB_SHAGI[i];
  if (!shag) return;
  snjatOreol();

                                                               
                                                                   
                                                         
  const cel = document.querySelector(shag.cel);
  if (cel) {
    cel.classList.add('pz-onb-cel');
    cel.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

                                                               
                                                                 
  let gotovo = !shag.delo;
  if (shag.delo) {
    try { gotovo = onb_sdelano.has(i) || Boolean(shag.delo.proverit()); }
    catch { gotovo = true; }                                             
    if (gotovo) onb_sdelano.add(i);
  }

                                                                    
                                                                 
  let polosa = document.getElementById('pz-onb');
  if (!polosa) {
    const fon = document.createElement('div');
    fon.className = 'pz-onb-fon';
    fon.id = 'pz-onb-fon';
    document.body.appendChild(fon);
    polosa = document.createElement('div');
    polosa.className = 'pz-onb';
    polosa.id = 'pz-onb';
    document.body.appendChild(polosa);
  }
  const poslednij = i === ONB_SHAGI.length - 1;
  polosa.innerHTML = `
    <div class="pz-onb-shag">шаг ${i + 1} из ${ONB_SHAGI.length}</div>
    <div class="pz-onb-z">${shag.z}</div>
    <div class="pz-onb-t">${shag.t}</div>
    <div class="pz-onb-niz">
      <div class="pz-onb-tochki">${ONB_SHAGI.map((_, k) =>
        `<i class="${k === i ? 'on' : onb_sdelano.has(k) || k < i
          ? 'proshli' : ''}"></i>`).join('')}</div>
      <span class="pz-onb-rast"></span>
      ${i > 0 ? '<a class="pz-onb-nazad" id="pz-onb-nazad">назад</a>' : ''}
      <a class="pz-onb-hvatit" id="pz-onb-hvatit">хватит</a>
      ${gotovo
        ? `<a class="pz-onb-knop" id="pz-onb-dalshe">${
            poslednij ? 'Готово' : 'Дальше'}</a>`
                                                                 
                                                                   
                                                         
        : `<span class="pz-onb-zovjot">${shag.delo.zovjot}</span>
           <a class="pz-onb-propustit" id="pz-onb-dalshe">пропустить</a>`}
    </div>`;

  document.getElementById('pz-onb-dalshe')?.addEventListener('click',
    () => idtiNaShag(i + 1));
  document.getElementById('pz-onb-nazad')?.addEventListener('click',
    () => idtiNaShag(i - 1));

function grafikZapisi(rows,{complete=false}={}){

  const days=new Set(rows.map(r=>Number(r.den)));
  P.grafik=(P.grafik||[]).filter(r=>!(Number(r.chelovek_id)===owner&&Number(r.god)===year&&Number(r.nedelja)===week&&(complete||days.has(Number(r.den))))).concat(rows);
}
function grafikIntervaly(row){
  if(!row)return 'не заполнено';const data=LocusScheduleModel.read(row);if(data.off)return 'не работаю';
  if(data.slots===null)return chasySlovom(data.hours)+' — '+(data.reason||'время не распределено');
  const cells=data.slots;if(!cells.length)return data.hours===0?'0 часов':'не заполнено';
  const ranges=[];let start=cells[0],end=start+0.5;
  for(const cell of cells.slice(1)){if(cell===end)end=cell+0.5;else{ranges.push([start,end]);start=cell;end=cell+0.5;}}ranges.push([start,end]);
  return ranges.map(([a,b])=>chasPodpis(a)+'–'+chasPodpis(b)).join(', ');
}

}

document.addEventListener('locus:feed-changed',event=>{
  const sent=event.detail?.context,field=document.getElementById('rf-tekst')||document.getElementById('vvod');
  if(event.detail?.cleared&&sent&&field?.dataset.feedKind===sent.kind&&(field.dataset.feedWeek||null)===sent.week&&field.value===sent.raw){field.value='';field.dataset.feedReady='0';}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&vkladka==='fokus')zagruzit().then(narisovat).catch(error=>O.tost('Не обновился таймер: '+error.message));});
document.addEventListener('locus:templates-changed',()=>{zagruzit().then(narisovat).catch(error=>O.tost(error.message));});
function privjazatSozdanieShablona(){
  const after=async()=>{await zagruzit();narisovat();};
  document.getElementById('shb-novyj')?.addEventListener('click',async()=>{try{(await O.templatesUi()).open(null,{after});}catch(error){O.tost(error.message);}});
  if(vkladka==='shablony')O.templatesUi().then(m=>m.notices()).catch(error=>O.tost(error.message));
}

let JA = API.ja;

(async function start() {
  try {
    SPRAV = await SPR.zagruzit();
    window.DANNYE = { napravlenija: SPRAV.napravlenija, ljudi: SPRAV.ljudi,
                      statusy: SPRAV.statusy, tipy: SPRAV.tipy, zadachi: [] };
    JA = API.ja;
                                                                 
                                                               
                                                                
                                                                  
    await zagruzitSprint();

                                                                    
                                                                 
                          
    const iz_adresa = new URLSearchParams(location.search).get('novoe');
    if (iz_adresa) {nv_stranica = Number(iz_adresa);nv_razdel='chto_novogo';}

    narisovatMenju();
    narisovat();
    O.vkljuchitSkvoznoe();

                                                                     
                                                                     
                                                                
    window.addEventListener('popstate', () => {
      const u = new URLSearchParams(location.search);
      const n = u.get('novoe');
      nv_stranica = n ? Number(n) : null;
      if(n)nv_razdel='chto_novogo';
      const v = u.get('vkladka');
      if (v && PORJADOK.includes(v) && v !== vkladka) {
        vkladka = v;
        document.querySelectorAll('[data-vtoroj]').forEach((e) =>
          e.classList.toggle('on', e.dataset.vtoroj === v));
      }
      narisovat();
    });
    document.body.dataset.gotovo = String(PORJADOK.reduce((a, k) => a + skolko(k), 0));
    document.body.dataset.sprint = String(rf_sprint);
                                                                  
                                                       
    if (new URLSearchParams(location.search).get('onbording') === '1') {
      try { history.replaceState(null, '', location.pathname); } catch {                  }
      setTimeout(() => pokazatOnbording(), 400);
    }
  } catch (e) {
    document.getElementById('telo').innerHTML =
      `<div class="pusto"><div class="pusto-z">Не получилось загрузить</div>
       <div class="pusto-p">${e.message}</div></div>`;
    document.body.dataset.oshibka = e.message;
  }
})();
})();
