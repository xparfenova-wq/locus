<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Проба карточки</title>
<link rel="icon" href="/api/favicon?v=L" type="image/svg+xml">
<link rel="stylesheet" href="/css/obschij.css">
<style>
                                                              
                                                              
                                                    
body{background:var(--bg)}
.pk{max-width:1340px;margin:0 auto;padding:28px 24px 60px}
.pk-z{font-size:21px;font-weight:500;letter-spacing:-.015em}
.pk-p{font-size:13px;color:var(--t3);margin-top:6px;max-width:62ch;line-height:1.5}
.pk-rjad{display:flex;justify-content:center;margin:22px 0 8px}
.pk-razmer{text-align:center;font-size:12px;color:var(--t3);margin-bottom:18px;
font-family:'Geist Mono',ui-monospace,monospace}
.pk-ekrany{display:flex;gap:28px;justify-content:center;align-items:flex-start}
.pk-ekran{display:flex;flex-direction:column;gap:9px;align-items:center}
.pk-podpis{font-size:11.5px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}
.pk-veb{width:860px;height:760px;border:1px solid var(--lin);border-radius:12px;
background:#fff;display:block}
.pk-tel{width:390px;height:780px;border:1px solid var(--lin);border-radius:28px;
background:#fff;display:block}
@media (max-width:1340px){.pk-veb{width:680px}}
@media (max-width:760px){
  .pk{padding:18px 16px 40px}
  .pk-ekran-veb{display:none}
  .pk-tel{width:100%;max-width:390px}
}
</style></head><body>
<div class="pk">
  <div class="pk-z">Проба карточки создания задачи</div>
  <div class="pk-p">Три размера названия задачи. Слева карточка на вебе, справа
    на телефоне, обе в настоящую величину. Рабочие экраны не меняются, создать
    задачу отсюда нельзя: можно печатать и нажимать, чтобы почувствовать</div>
  <div class="pk-rjad"><span class="vid km-vid" id="pk-var">
    <a class="vid-e on" data-zag="21" data-mob="17">как сейчас</a>
    <a class="vid-e" data-zag="28" data-mob="21">крупнее</a>
    <a class="vid-e" data-zag="42" data-mob="34">вдвое</a>
  </span></div>
  <div class="pk-razmer" id="pk-razmer"></div>
  <div class="pk-ekrany">
    <div class="pk-ekran pk-ekran-veb"><span class="pk-podpis">веб</span>
      <iframe class="pk-veb" id="pk-veb" title="карточка на вебе"></iframe></div>
    <div class="pk-ekran"><span class="pk-podpis">телефон</span>
      <iframe class="pk-tel" id="pk-tel" title="карточка на телефоне"></iframe></div>
  </div>
</div>
<script>
(function () {
  const adres = (zag, mob) => `/sozdat.html?proba=1&zag=${zag}&zag_mob=${mob}`
    + '&nazvanie=' + encodeURIComponent('Собрать смету по тендерному агенту');
  const pokazat = (e) => {
    document.querySelectorAll('#pk-var .vid-e').forEach((x) => x.classList.toggle('on', x === e));
    const zag = e.dataset.zag, mob = e.dataset.mob;
    document.getElementById('pk-veb').src = adres(zag, mob);
    document.getElementById('pk-tel').src = adres(zag, mob);
    document.getElementById('pk-razmer').textContent =
      `название: веб ${zag}px, телефон ${mob}px`;
    try { history.replaceState(null, '', '?var=' + zag); } catch {                  }
  };
  document.getElementById('pk-var').addEventListener('click', (ev) => {
    const e = ev.target.closest('.vid-e'); if (e) pokazat(e);
  });
  const iz_adresa = new URLSearchParams(location.search).get('var');
  pokazat(document.querySelector(`#pk-var [data-zag="${iz_adresa}"]`)
    || document.querySelector('#pk-var .vid-e'));
})();
</script>
</body></html>
